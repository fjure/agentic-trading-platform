[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-trading-lab"
version = "0.1.0"
description = "Fail-closed local paper trading laboratory"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.143.0",
  "pydantic==2.14.1",
  "sqlalchemy==2.1.4",
  "alembic==1.20.0",
  "psycopg[binary,pool]==3.3.6",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "hypothesis==6.169.0",
  "pip-audit==2.10.1",
  "ruff==0.17.0",
  "build==1.6.1",
  "jsonschema==4.26.0",
  "pyyaml==6.0.3",
]

[tool.setuptools.packages.find]
include = ["services*", "packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
