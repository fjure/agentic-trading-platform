    BacktestProblemCode:
      type: string
      enum:
      - INVALID_REQUEST
      - UNAUTHORIZED
      - FORBIDDEN
      - NOT_FOUND
      - CURSOR_INVALID
      - SNAPSHOT_CONFLICT
      - IDEMPOTENCY_CONFLICT
      - UNAVAILABLE
    BacktestProblem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          const: urn:agentic-trading-lab:backtest-problem
        title:
          type: string
          const: Backtest request failed
        status:
          type: integer
          enum:
          - 400
          - 401
          - 403
          - 404
          - 409
          - 503
        code:
          $ref: '#/components/schemas/BacktestProblemCode'
        traceId:
          type: string
          pattern: ^[0-9a-f]{32}$
      description: Whitelist-only sanitized problem; no provider text, SQL, stack, credentials or arbitrary detail.
      allOf:
      - if:
          properties:
            status:
              const: 400
          additionalProperties: true
        then:
          properties:
            code:
              type: string
              enum:
              - INVALID_REQUEST
              - CURSOR_INVALID
          additionalProperties: true
        additionalProperties: true
      - if:
          properties:
            status:
              const: 401
          additionalProperties: true
        then:
          properties:
            code:
              type: string
              enum:
              - UNAUTHORIZED
          additionalProperties: true
        additionalProperties: true
      - if:
          properties:
            status:
              const: 403
          additionalProperties: true
        then:
          properties:
            code:
              type: string
              enum:
              - FORBIDDEN
          additionalProperties: true
        additionalProperties: true
      - if:
          properties:
            status:
              const: 404
          additionalProperties: true
        then:
          properties:
            code:
              type: string
              enum:
              - NOT_FOUND
          additionalProperties: true
        additionalProperties: true
      - if:
          properties:
            status:
              const: 409
          additionalProperties: true
        then:
          properties:
            code:
              type: string
              enum:
              - SNAPSHOT_CONFLICT
              - IDEMPOTENCY_CONFLICT
          additionalProperties: true
        additionalProperties: true
      - if:
          properties:
            status:
              const: 503
          additionalProperties: true
        then:
          properties:
            code:
              type: string
              enum:
              - UNAVAILABLE
          additionalProperties: true
        additionalProperties: true
    ReadinessEligibility:
      type: string
