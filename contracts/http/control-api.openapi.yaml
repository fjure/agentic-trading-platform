      - signalConflict
      - modelId
      - promptVersion
      - questionVersion
      - configVersion
      - inputHash
      - latencyMs
      - apiUnits
      - estimatedCost
      - validUntil
      - traceId
      - reasonCode
      properties:
        id:
          type: string
        marketStateId:
          type: string
        choice:
          type: string
          enum:
          - LONG
          - FLAT
          - ABSTAIN
        typedAnswers:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - regime
          - evidenceQuality
          - signalConflict
          properties:
            regime:
              type: object
              additionalProperties: false
              required:
              - kind
              - questionVersion
              - choice
              - confidence
              - distribution
              properties:
                kind:
                  type: string
                  const: CHOICE
                questionVersion:
                  type: string
                choice:
                  type: string
                  enum:
                  - TREND
                  - RANGE
                  - UNCERTAIN
                confidence:
                  $ref: '#/components/schemas/Fraction'
                distribution:
                  type: object
                  additionalProperties: false
                  required:
                  - TREND
                  - RANGE
                  - UNCERTAIN
                  properties:
                    TREND:
                      $ref: '#/components/schemas/Fraction'
                    RANGE:
                      $ref: '#/components/schemas/Fraction'
                    UNCERTAIN:
                      $ref: '#/components/schemas/Fraction'
            evidenceQuality:
              type: object
              additionalProperties: false
              required:
              - kind
              - questionVersion
              - score
              - legend
              - distribution
              - confidence
              properties:
                kind:
                  type: string
                  const: SCORE
                questionVersion:
                  type: string
                score:
                  type: string
                  pattern: ^([0-8](\.[0-9]{1,18})?|9(\.0{1,18})?)$
                legend:
                  type: object
                  minProperties: 2
                  patternProperties:
                    ^[0-9]$:
                      type: string
                      minLength: 1
                  additionalProperties: false
                distribution:
                  type: object
                  minProperties: 2
                  patternProperties:
                    ^[0-9]$:
                      $ref: '#/components/schemas/Fraction'
                  additionalProperties: false
                confidence:
                  $ref: '#/components/schemas/Fraction'
            signalConflict:
              type: object
              additionalProperties: false
              required:
              - kind
              - questionVersion
              - noul
              properties:
                kind:
                  type: string
                  const: NOUL
                questionVersion:
                  type: string
                noul:
                  $ref: '#/components/schemas/Fraction'
            shadowDirection:
              type: object
              additionalProperties: false
              required:
              - kind
              - questionVersion
              - choice
              - confidence
              - distribution
              properties:
                kind:
                  type: string
                  const: CHOICE
                questionVersion:
                  type: string
                choice:
                  type: string
                  enum:
                  - LONG
                  - FLAT
                  - ABSTAIN
                confidence:
                  $ref: '#/components/schemas/Fraction'
                distribution:
                  type: object
                  additionalProperties: false
                  required:
                  - LONG
                  - FLAT
                  - ABSTAIN
                  properties:
                    LONG:
                      $ref: '#/components/schemas/Fraction'
                    FLAT:
                      $ref: '#/components/schemas/Fraction'
                    ABSTAIN:
                      $ref: '#/components/schemas/Fraction'
        confidence:
          type:
          - string
          - 'null'
          pattern: ^(0(\.[0-9]{1,18})?|1(\.0{1,18})?)$
          example: '0.10'
        distribution:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/Fraction'
        regime:
          type:
          - string
          - 'null'
          enum:
          - TREND
          - RANGE
          - UNCERTAIN
          - null
        evidenceQuality:
          type:
          - string
          - 'null'
          pattern: ^(0(\.[0-9]{1,18})?|1(\.0{1,18})?)$
          example: '0.10'
        signalConflict:
          type:
          - string
          - 'null'
          pattern: ^(0(\.[0-9]{1,18})?|1(\.0{1,18})?)$
          example: '0.10'
        shadowChoice:
          type: string
          enum:
          - LONG
          - FLAT
          - ABSTAIN
        modelId:
          type:
          - string
          - 'null'
        promptVersion:
          type: string
        questionVersion:
          type: string
        configVersion:
          type: string
        inputHash:
          type: string
          pattern: ^[0-9a-f]{64}$
        latencyMs:
          type: integer
          minimum: 0
        apiUnits:
          type:
          - string
          - 'null'
          pattern: ^-?(0|[1-9][0-9]{0,19})(\.[0-9]{1,18})?$
          example: '123.45'
        inputTokens:
          description: Project-safe observed Jev input token count; paired with outputTokens when supplied.
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 9007199254740991
        outputTokens:
          description: Project-safe observed Jev output token count; paired with inputTokens when supplied.
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 9007199254740991
        estimatedCost:
          type:
          - string
          - 'null'
          pattern: ^-?(0|[1-9][0-9]{0,19})(\.[0-9]{1,18})?$
          example: '123.45'
        validUntil:
          $ref: '#/components/schemas/UtcTimestamp'
        traceId:
          $ref: '#/components/schemas/TraceId'
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'
      dependentRequired:
        inputTokens:
        - outputTokens
        outputTokens:
        - inputTokens
      dependentSchemas:
        inputTokens:
          if:
            properties:
              inputTokens:
                type: 'null'
          then:
            properties:
              outputTokens:
                type: 'null'
          else:
            properties:
              outputTokens:
                type: integer
      if:
        properties:
          typedAnswers:
            type: 'null'
      then:
        properties:
          typedAnswers:
            type: 'null'
          confidence:
            type: 'null'
          distribution:
            type: 'null'
          regime:
            type: 'null'
          evidenceQuality:
            type: 'null'
          signalConflict:
            type: 'null'
          modelId:
            type: 'null'
          choice:
            const: ABSTAIN
