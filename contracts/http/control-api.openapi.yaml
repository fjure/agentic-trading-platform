        It is bound atomically to the saved profile version; it does not assert a provider verification or
        activate trading.
    PaperTradingProfile:
      type: object
      additionalProperties: false
      required:
      - namespace
      - configured
      - currency
      - riskBudget
      - strategy
      - strategyVersion
      - credentialGeneration
      - accountGeneration
      - policyVersion
      - profileVersion
      - budgetVersion
      - limitPolicyVersion
      - feeAttestation
      - traceId
      properties:
        namespace:
          type: string
          const: alpaca-paper
        configured:
          type: boolean
        currency:
          type: string
          const: USD
        riskBudget:
          type:
          - string
          - 'null'
          pattern: ^(?=.*[1-9])(?:(?:0|[1-9][0-9]{0,5})(?:\.[0-9]{1,18})?|1000000(?:\.0{1,18})?)$
        strategy:
          type:
          - string
          - 'null'
          enum:
          - mock-neutral
          - neutral-baseline
          - jev
          - null
        strategyVersion:
          type:
          - string
          - 'null'
          enum:
          - mock-neutral.v1
          - neutral-baseline.v1
          - jev.v1
          - null
        credentialGeneration:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        accountGeneration:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        policyVersion:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        profileVersion:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        budgetVersion:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        limitPolicyVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        feeAttestation:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - scope
          - confirmed
          properties:
            scope:
              type: string
              const: alpaca-paper-direct-retail-us-equity-zero-v1
            confirmed:
              type: boolean
              const: true
        traceId:
          $ref: '#/components/schemas/TraceId'
      description: Versioned isolated Paper settings. Unconfigured means no saved budget, strategy or fee
        attestation; policyVersion is zero only when no authoritative risk policy exists. Configured credential/account
        generations are the stored profile bindings and never silently rebind on rotation. Saving closes entry
        gates and never activates trading. strategyVersion names the stored strategy mapping, not a model
        run version.
      if:
        properties:
          configured:
            const: false
      then:
        properties:
          namespace: {}
          configured: {}
          currency: {}
          riskBudget:
            type: 'null'
          strategy:
            type: 'null'
          strategyVersion:
            type: 'null'
          credentialGeneration:
            const: 0
          accountGeneration:
            const: 0
          policyVersion: {}
          profileVersion:
            const: 0
          budgetVersion:
            const: 0
          limitPolicyVersion: {}
          feeAttestation:
            type: 'null'
          traceId: {}
      else:
        properties:
          namespace: {}
          configured: {}
          currency: {}
          riskBudget:
            type: string
          strategy:
            type: string
          strategyVersion:
            type: string
          credentialGeneration:
            minimum: 1
          accountGeneration:
            minimum: 1
          policyVersion:
            minimum: 1
          profileVersion:
            minimum: 1
          budgetVersion:
            minimum: 1
          limitPolicyVersion: {}
          feeAttestation:
            type: object
          traceId: {}
      not:
        anyOf:
        - properties:
            strategy:
              const: mock-neutral
            strategyVersion:
              not:
                const: mock-neutral.v1
        - properties:
            strategy:
              const: neutral-baseline
            strategyVersion:
              not:
                const: neutral-baseline.v1
        - properties:
            strategy:
              const: jev
            strategyVersion:
              not:
                const: jev.v1
