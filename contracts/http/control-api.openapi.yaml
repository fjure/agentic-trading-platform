      - $ref: '#/components/schemas/ResearchFundamentalContent'
      - $ref: '#/components/schemas/ResearchMacroContent'
      - $ref: '#/components/schemas/ResearchDerivedContent'
      discriminator:
        propertyName: kind
        mapping:
          BAR: '#/components/schemas/ResearchBarContent'
          NEWS: '#/components/schemas/ResearchNewsContent'
          FUNDAMENTAL: '#/components/schemas/ResearchFundamentalContent'
          MACRO_EVENT: '#/components/schemas/ResearchMacroContent'
          DERIVED: '#/components/schemas/ResearchDerivedContent'
    ResearchEvidence:
      type: object
      additionalProperties: false
      required:
      - evidenceId
      - instrumentId
      - sourceId
      - sourceReference
      - eventTime
      - publishedAt
      - availableAt
      - ingestedAt
      - availabilityBasis
      - schemaVersion
      - dataRevision
      - predecessorId
      - fingerprint
      - quality
      - modelConfidence
      - content
      - commitVersion
      - market
      properties:
        evidenceId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        instrumentId:
          anyOf:
          - type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          - type: 'null'
        sourceId:
          type: string
          minLength: 1
          maxLength: 64
        sourceReference:
          type: string
          pattern: ^(?!.*://)[A-Za-z0-9][A-Za-z0-9:._/-]{0,255}$
          description: Opaque normalized source identifier; no URL/query string or provider transport data.
        eventTime:
          $ref: '#/components/schemas/ResearchTimestamp'
        publishedAt:
          anyOf:
          - $ref: '#/components/schemas/ResearchTimestamp'
          - type: 'null'
        availableAt:
          $ref: '#/components/schemas/ResearchTimestamp'
        ingestedAt:
          $ref: '#/components/schemas/ResearchTimestamp'
        availabilityBasis:
          type: string
          enum:
          - FIRST_OBSERVED
          - VERIFIED_PUBLICATION
        schemaVersion:
          type: string
          const: '1'
        dataRevision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        predecessorId:
          anyOf:
          - type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          - type: 'null'
        fingerprint:
          $ref: '#/components/schemas/ResearchFingerprint'
        quality:
          $ref: '#/components/schemas/ResearchQuality'
        modelConfidence:
          anyOf:
          - type: string
            pattern: ^(0(\.\d{1,18})?|1(\.0{1,18})?)$
          - type: 'null'
        content:
          $ref: '#/components/schemas/ResearchEvidenceContent'
        commitVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        market:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
    ResearchSnapshot:
      type: object
      additionalProperties: false
      required:
      - valuationAt
      - knowledgeAt
      - snapshotAt
      - snapshotVersion
      - semantics
      properties:
        valuationAt:
          $ref: '#/components/schemas/ResearchTimestamp'
        knowledgeAt:
          $ref: '#/components/schemas/ResearchTimestamp'
        snapshotAt:
          $ref: '#/components/schemas/ResearchTimestamp'
        snapshotVersion:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        semantics:
          type: string
          enum:
          - observed-as-of
      description: knowledgeAt <= valuationAt. Select event/bar end <= valuationAt AND availableAt <= knowledgeAt AND
        ingestedAt <= knowledgeAt AND commitVersion <= snapshotVersion. Fresh query defaults both times to a single
        request clock instant. snapshotAt/version are server-bound; never supplied freely by a client.
    ResearchCoverage:
      type: object
      additionalProperties: false
      required:
      - instrumentId
      - provider
      - feed
      - interval
      - adjustment
      - start
      - end
      - qualityRuleVersion
      - calendarVersion
      - status
      - expected
      - observed
      - missing
      - unchecked
      properties:
        instrumentId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        provider:
          type: string
          enum:
          - ALPACA
        feed:
          type: string
          enum:
          - iex
        interval:
          $ref: '#/components/schemas/ResearchInterval'
        adjustment:
          type: string
          enum:
          - raw
        start:
          $ref: '#/components/schemas/ResearchTimestamp'
        end:
          $ref: '#/components/schemas/ResearchTimestamp'
        qualityRuleVersion:
          type: string
          enum:
          - research-quality-v1
        calendarVersion:
          anyOf:
          - $ref: '#/components/schemas/ResearchFingerprint'
          - type: 'null'
        status:
          $ref: '#/components/schemas/ResearchQuality'
        expected:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 9007199254740991
          - type: 'null'
        observed:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        missing:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 9007199254740991
          - type: 'null'
        unchecked:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    ResearchBarPage:
      type: object
