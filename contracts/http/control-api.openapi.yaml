components:
  securitySchemes:
    LocalSession:
      type: apiKey
      in: cookie
      name: atl_session
      description: Same-origin HttpOnly Secure (where TLS is used), SameSite=Strict local operator session. The
        runtime must provide explicit local authentication, Origin checks, and CSRF protection for writes; never
        place tokens in URLs or SSE cursors.
  parameters:
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context; absent or invalid input is replaced by a server trace.
      schema:
        type: string
        pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque caller-generated key scoped to actor and operation, retained at least 24 hours. Same key
        and same payload return the original semantic result; same key with different payload is a 409 IDEMPOTENCY_CONFLICT.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag from GET /risk-policy. Missing yields 428; stale yields 412.
      schema:
        type: string
        minLength: 3
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque server cursor; do not infer timestamps or database positions.
      schema:
        $ref: '#/components/schemas/Cursor'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    Refused:
      description: Business rule refused the requested state transition.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            refused:
              value:
                type: https://agentic-trading-lab.invalid/problems/control-refused
                title: Control action refused
                status: 409
                code: HEALTH_CHECK_FAILED
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            idempotencyConflict:
              value:
                type: https://agentic-trading-lab.invalid/problems/idempotency-conflict
                title: Idempotency key reused with different payload
                status: 409
                code: IDEMPOTENCY_CONFLICT
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    InvalidRequest:
      description: Invalid request shape or activation code.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://agentic-trading-lab.invalid/problems/invalid-request
            title: Invalid request
            status: 400
            code: INVALID_REQUEST
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    VersionConflict:
      description: If-Match does not match the current policy ETag.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://agentic-trading-lab.invalid/problems/version-conflict
            title: Policy version conflict
            status: 412
            code: VERSION_CONFLICT
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    PreconditionRequired:
      description: The required If-Match precondition is absent.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://agentic-trading-lab.invalid/problems/precondition-required
            title: If-Match required
            status: 428
            code: PRECONDITION_REQUIRED
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    CursorExpired:
      description: Cursor is unknown, expired, or no longer contiguous; fetch a fresh snapshot.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://agentic-trading-lab.invalid/problems/cursor-expired
            title: Cursor expired
            status: 410
            code: CURSOR_EXPIRED
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    TemporarilyUnavailable:
      description: Required dependency unavailable; request did not authorize a broker retry.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unavailable:
              value:
                type: https://agentic-trading-lab.invalid/problems/temporarily-unavailable
                title: Dependency unavailable
                status: 503
                code: TEMPORARILY_UNAVAILABLE
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            brokerUnknown:
              value:
                type: https://agentic-trading-lab.invalid/problems/broker-status-unknown
                title: Broker status unknown; reconciliation required
                status: 503
                code: BROKER_STATUS_UNKNOWN
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    AuthenticationRequired:
      description: Missing or expired local operator session; no credential or internal detail is returned.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    RuntimeHealth:
      type: object
      additionalProperties: false
      required:
      - status
      - checks
      properties:
        status:
          type: string
          enum:
          - HEALTHY
          - DEGRADED
          - UNAVAILABLE
        checks:
          type: object
          additionalProperties: false
          required:
          - DATABASE
          properties:
            DATABASE:
              type: string
              enum:
              - HEALTHY
              - DEGRADED
              - UNAVAILABLE
            BROKER:
              type: string
              enum:
              - HEALTHY
              - DEGRADED
              - UNAVAILABLE
            MARKET:
              type: string
              enum:
              - HEALTHY
              - DEGRADED
              - UNAVAILABLE
            DECISION:
              type: string
              enum:
              - HEALTHY
              - DEGRADED
              - UNAVAILABLE
            EXECUTION:
              type: string
              enum:
              - HEALTHY
              - DEGRADED
              - UNAVAILABLE
            WATCHDOG:
              type: string
              enum:
              - HEALTHY
              - DEGRADED
              - UNAVAILABLE
    Cursor:
      type: string
      minLength: 1
      maxLength: 256
      example: c_000123
    UtcTimestamp:
      type: string
      format: date-time
      pattern: Z$
      example: '2026-10-12T10:00:00Z'
    Decimal:
      type: string
      pattern: ^-?(0|[1-9][0-9]{0,19})(\.[0-9]{1,18})?$
      example: '123.45'
    Fraction:
      type: string
      pattern: ^(0(\.[0-9]{1,18})?|1(\.0{1,18})?)$
      example: '0.10'
    TraceId:
      type: string
      pattern: ^[0-9a-f]{32}$
      example: 4bf92f3577b34da6a3ce929d0e0e4736
    ReasonCode:
      type: string
      description: Stable internal code, never raw provider text.
      enum:
      - OK
      - ABSTAIN_MISSING_EVIDENCE
      - ABSTAIN_INVALID_RESPONSE
      - ABSTAIN_UNAVAILABLE
      - RISK_STALE_MARKET
      - RISK_SESSION_CLOSED
      - RISK_POLICY_INCOMPLETE
      - RISK_LIMIT_EXCEEDED
      - RISK_CAPABILITY_UNCONFIRMED
      - RISK_PROPOSAL_EXPIRED
      - RISK_RECONCILIATION_REQUIRED
      - MODE_NOT_PAPER
      - PAUSED_NEW
      - KILL_SWITCH_ACTIVE
      - HEALTH_CHECK_FAILED
      - BROKER_STATUS_UNKNOWN
      - TEMPORARILY_UNAVAILABLE
      - VERSION_CONFLICT
      - PRECONDITION_REQUIRED
      - IDEMPOTENCY_CONFLICT
      - CURSOR_EXPIRED
      - INVALID_REQUEST
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Sanitized text with no secret or stack trace.
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ReasonCode'
        traceId:
          $ref: '#/components/schemas/TraceId'
    ModeState:
      type: object
      additionalProperties: false
      required:
      - mode
      - pauseNew
      - killSwitch
      - health
      - reconciliation
      - changedAt
      - traceId
      properties:
        mode:
          type: string
          enum:
          - DISABLED
          - REPLAY
          - SHADOW
          - PAPER
        pauseNew:
          type: boolean
        killSwitch:
          type: boolean
        health:
          type: string
          enum:
          - HEALTHY
          - DEGRADED
          - UNAVAILABLE
        reconciliation:
          type: string
          enum:
          - CURRENT
          - PENDING
          - MISMATCH
        changedAt:
          $ref: '#/components/schemas/UtcTimestamp'
        traceId:
          $ref: '#/components/schemas/TraceId'
    SetModeRequest:
      type: object
      additionalProperties: false
      required:
      - mode
      - reason
      properties:
        mode:
          type: string
          enum:
          - DISABLED
          - REPLAY
          - SHADOW
          - PAPER
        reason:
          type: string
          minLength: 1
          maxLength: 500
    ControlReason:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    ActivateSessionRequest:
      type: object
      additionalProperties: false
      required:
      - activationCode
      properties:
        activationCode:
          type: string
          minLength: 32
          maxLength: 256
          description: One-use local operator code; never log or echo it.
    RiskPolicyUpdate:
      type: object
      additionalProperties: false
      required:
      - maxPositionsPerInstrument
      - maxOpenPositions
      - maxPositionEquityFraction
      - maxDailyLossFraction
      properties:
        maxPositionsPerInstrument:
          type: integer
          minimum: 1
        maxOpenPositions:
          type: integer
          minimum: 1
        maxPositionEquityFraction:
          $ref: '#/components/schemas/Fraction'
        maxDailyLossFraction:
          $ref: '#/components/schemas/Fraction'
    RiskPolicy:
      type: object
      additionalProperties: false
      required:
      - maxPositionsPerInstrument
      - maxOpenPositions
      - maxPositionEquityFraction
      - maxDailyLossFraction
      - version
      - simulationOnly
      - effectiveAt
      - changedAt
      - changedBy
      - auditEventId
      properties:
        maxPositionsPerInstrument:
          type: integer
          minimum: 1
        maxOpenPositions:
          type: integer
          minimum: 1
        maxPositionEquityFraction:
          $ref: '#/components/schemas/Fraction'
        maxDailyLossFraction:
          $ref: '#/components/schemas/Fraction'
        version:
          type: integer
          minimum: 1
        simulationOnly:
          type: boolean
          const: true
        effectiveAt:
          $ref: '#/components/schemas/UtcTimestamp'
        changedAt:
          $ref: '#/components/schemas/UtcTimestamp'
        changedBy:
          type: string
          description: Non-PII local operator alias.
        auditEventId:
          type: string
    MarketState:
      type: object
      additionalProperties: false
      required:
      - id
      - instrument
      - market
      - interval
      - bar
      - eventTime
      - receivedAt
      - availableAt
      - asOf
      - features
      - evidence
      - spread
      - quality
      - portfolio
      - position
      - traceId
      properties:
        id:
          type: string
        instrument:
          type: string
        market:
          type: string
          enum:
          - US_EQUITY
          - CRYPTO
        interval:
          type: string
          const: PT15M
        bar:
          type: object
          additionalProperties: false
          required:
          - startAt
          - endAt
          - open
          - high
          - low
          - close
          - volume
          - closed
          properties:
            startAt:
              $ref: '#/components/schemas/UtcTimestamp'
            endAt:
              $ref: '#/components/schemas/UtcTimestamp'
            open:
              $ref: '#/components/schemas/Decimal'
            high:
              $ref: '#/components/schemas/Decimal'
            low:
              $ref: '#/components/schemas/Decimal'
            close:
              $ref: '#/components/schemas/Decimal'
            volume:
              $ref: '#/components/schemas/Decimal'
            closed:
              type: boolean
              const: true
        eventTime:
          $ref: '#/components/schemas/UtcTimestamp'
        receivedAt:
          $ref: '#/components/schemas/UtcTimestamp'
        availableAt:
          $ref: '#/components/schemas/UtcTimestamp'
        asOf:
          $ref: '#/components/schemas/UtcTimestamp'
        features:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Decimal'
        evidence:
          type: object
          additionalProperties: false
          required:
          - neutral
          - sources
          - availableAt
          - conflicts
          - quality
          properties:
            neutral:
              type: boolean
              const: true
            sources:
              type: array
              items:
                type: string
            availableAt:
              $ref: '#/components/schemas/UtcTimestamp'
            conflicts:
              type: array
              items:
                type: string
            quality:
              type: string
              enum:
              - VALID
              - STALE
              - GAP
              - CONFLICT
              - INVALID
        spread:
          $ref: '#/components/schemas/Decimal'
        quality:
          type: string
          enum:
          - VALID
          - STALE
          - GAP
          - CONFLICT
          - INVALID
        portfolio:
          type: object
          additionalProperties: false
          required:
          - equity
          - cash
          properties:
            equity:
              $ref: '#/components/schemas/Decimal'
            cash:
              $ref: '#/components/schemas/Decimal'
        position:
          type: object
          additionalProperties: false
          required:
          - quantity
          properties:
            quantity:
              $ref: '#/components/schemas/Decimal'
            averagePrice:
              $ref: '#/components/schemas/Decimal'
        traceId:
          $ref: '#/components/schemas/TraceId'
    Decision:
      type: object
      additionalProperties: false
      required:
      - id
      - marketStateId
      - choice
      - typedAnswers
      - confidence
      - distribution
      - regime
      - evidenceQuality
      - signalConflict
      - modelId
      - promptVersion
      - questionVersion
      - configVersion
      - inputHash
      - latencyMs
      - apiUnits
      - estimatedCost
      - validUntil
      - traceId
      - reasonCode
      properties:
        id:
          type: string
        marketStateId:
          type: string
        choice:
          type: string
          enum:
          - LONG
          - FLAT
          - ABSTAIN
        typedAnswers:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - regime
          - evidenceQuality
          - signalConflict
          properties:
            regime:
              type: object
              additionalProperties: false
              required:
              - kind
              - questionVersion
              - choice
              - confidence
              - distribution
              properties:
                kind:
                  type: string
                  const: CHOICE
                questionVersion:
                  type: string
                choice:
                  type: string
                  enum:
                  - TREND
                  - RANGE
                  - UNCERTAIN
                confidence:
                  $ref: '#/components/schemas/Fraction'
                distribution:
                  type: object
                  additionalProperties: false
                  required:
                  - TREND
                  - RANGE
                  - UNCERTAIN
                  properties:
                    TREND:
                      $ref: '#/components/schemas/Fraction'
                    RANGE:
                      $ref: '#/components/schemas/Fraction'
                    UNCERTAIN:
                      $ref: '#/components/schemas/Fraction'
            evidenceQuality:
              type: object
              additionalProperties: false
              required:
              - kind
              - questionVersion
              - score
              - legend
              - distribution
              - confidence
              properties:
                kind:
                  type: string
                  const: SCORE
                questionVersion:
                  type: string
                score:
                  type: string
                  pattern: ^([0-8](\.[0-9]{1,18})?|9(\.0{1,18})?)$
                legend:
                  type: object
                  minProperties: 2
                  patternProperties:
                    ^[0-9]$:
                      type: string
                      minLength: 1
                  additionalProperties: false
                distribution:
                  type: object
                  minProperties: 2
                  patternProperties:
                    ^[0-9]$:
                      $ref: '#/components/schemas/Fraction'
                  additionalProperties: false
                confidence:
                  $ref: '#/components/schemas/Fraction'
            signalConflict:
              type: object
              additionalProperties: false
              required:
              - kind
              - questionVersion
              - noul
              properties:
                kind:
                  type: string
                  const: NOUL
                questionVersion:
                  type: string
                noul:
                  $ref: '#/components/schemas/Fraction'
            shadowDirection:
              type: object
              additionalProperties: false
              required:
              - kind
              - questionVersion
              - choice
              - confidence
              - distribution
              properties:
                kind:
                  type: string
                  const: CHOICE
                questionVersion:
                  type: string
                choice:
                  type: string
                  enum:
                  - LONG
                  - FLAT
                  - ABSTAIN
                confidence:
                  $ref: '#/components/schemas/Fraction'
                distribution:
                  type: object
                  additionalProperties: false
                  required:
                  - LONG
                  - FLAT
                  - ABSTAIN
                  properties:
                    LONG:
                      $ref: '#/components/schemas/Fraction'
                    FLAT:
                      $ref: '#/components/schemas/Fraction'
                    ABSTAIN:
                      $ref: '#/components/schemas/Fraction'
        confidence:
          type:
          - string
          - 'null'
          pattern: ^(0(\.[0-9]{1,18})?|1(\.0{1,18})?)$
          example: '0.10'
        distribution:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/Fraction'
        regime:
          type:
          - string
          - 'null'
          enum:
          - TREND
          - RANGE
          - UNCERTAIN
          - null
        evidenceQuality:
          type:
          - string
          - 'null'
          pattern: ^(0(\.[0-9]{1,18})?|1(\.0{1,18})?)$
          example: '0.10'
        signalConflict:
          type:
          - string
          - 'null'
          pattern: ^(0(\.[0-9]{1,18})?|1(\.0{1,18})?)$
          example: '0.10'
        shadowChoice:
          type: string
          enum:
          - LONG
          - FLAT
          - ABSTAIN
        modelId:
          type:
          - string
          - 'null'
        promptVersion:
          type: string
        questionVersion:
          type: string
        configVersion:
          type: string
        inputHash:
          type: string
          pattern: ^[0-9a-f]{64}$
        latencyMs:
          type: integer
          minimum: 0
        apiUnits:
          type:
          - string
          - 'null'
          pattern: ^-?(0|[1-9][0-9]{0,19})(\.[0-9]{1,18})?$
          example: '123.45'
        inputTokens:
          description: Project-safe observed Jev input token count; paired with outputTokens when supplied.
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 9007199254740991
        outputTokens:
          description: Project-safe observed Jev output token count; paired with inputTokens when supplied.
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 9007199254740991
        estimatedCost:
          type:
          - string
          - 'null'
          pattern: ^-?(0|[1-9][0-9]{0,19})(\.[0-9]{1,18})?$
          example: '123.45'
        validUntil:
          $ref: '#/components/schemas/UtcTimestamp'
        traceId:
          $ref: '#/components/schemas/TraceId'
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'
      dependentRequired:
        inputTokens:
        - outputTokens
        outputTokens:
        - inputTokens
      dependentSchemas:
        inputTokens:
          if:
            properties:
              inputTokens:
                type: 'null'
          then:
            properties:
              outputTokens:
                type: 'null'
          else:
            properties:
              outputTokens:
                type: integer
      if:
        properties:
          typedAnswers:
            type: 'null'
      then:
        properties:
          typedAnswers:
            type: 'null'
          confidence:
            type: 'null'
          distribution:
            type: 'null'
          regime:
            type: 'null'
          evidenceQuality:
            type: 'null'
          signalConflict:
            type: 'null'
          modelId:
            type: 'null'
          choice:
            const: ABSTAIN
          reasonCode:
            enum:
            - ABSTAIN_MISSING_EVIDENCE
            - ABSTAIN_INVALID_RESPONSE
            - ABSTAIN_UNAVAILABLE
      else:
        properties:
          typedAnswers:
            type: object
            additionalProperties: false
            required:
            - regime
            - evidenceQuality
            - signalConflict
            properties:
              regime:
                type: object
                additionalProperties: false
                required:
                - kind
                - questionVersion
                - choice
                - confidence
                - distribution
                properties:
                  kind:
                    type: string
                    const: CHOICE
                  questionVersion:
                    type: string
                  choice:
                    type: string
                    enum:
                    - TREND
                    - RANGE
                    - UNCERTAIN
                  confidence:
                    $ref: '#/components/schemas/Fraction'
                  distribution:
                    type: object
                    additionalProperties: false
                    required:
                    - TREND
                    - RANGE
                    - UNCERTAIN
                    properties:
                      TREND:
                        $ref: '#/components/schemas/Fraction'
                      RANGE:
                        $ref: '#/components/schemas/Fraction'
                      UNCERTAIN:
                        $ref: '#/components/schemas/Fraction'
              evidenceQuality:
                type: object
                additionalProperties: false
                required:
                - kind
                - questionVersion
                - score
                - legend
                - distribution
                - confidence
                properties:
                  kind:
                    type: string
                    const: SCORE
                  questionVersion:
                    type: string
                  score:
                    type: string
                    pattern: ^([0-8](\.[0-9]{1,18})?|9(\.0{1,18})?)$
                  legend:
                    type: object
                    minProperties: 2
                    patternProperties:
                      ^[0-9]$:
                        type: string
                        minLength: 1
                    additionalProperties: false
                  distribution:
                    type: object
                    minProperties: 2
                    patternProperties:
                      ^[0-9]$:
                        $ref: '#/components/schemas/Fraction'
                    additionalProperties: false
                  confidence:
                    $ref: '#/components/schemas/Fraction'
              signalConflict:
                type: object
                additionalProperties: false
                required:
                - kind
                - questionVersion
                - noul
                properties:
                  kind:
                    type: string
                    const: NOUL
                  questionVersion:
                    type: string
                  noul:
                    $ref: '#/components/schemas/Fraction'
              shadowDirection:
                type: object
                additionalProperties: false
                required:
                - kind
                - questionVersion
                - choice
                - confidence
                - distribution
                properties:
                  kind:
                    type: string
                    const: CHOICE
                  questionVersion:
                    type: string
                  choice:
                    type: string
                    enum:
                    - LONG
                    - FLAT
                    - ABSTAIN
                  confidence:
                    $ref: '#/components/schemas/Fraction'
                  distribution:
                    type: object
                    additionalProperties: false
                    required:
                    - LONG
                    - FLAT
                    - ABSTAIN
                    properties:
                      LONG:
                        $ref: '#/components/schemas/Fraction'
                      FLAT:
                        $ref: '#/components/schemas/Fraction'
                      ABSTAIN:
                        $ref: '#/components/schemas/Fraction'
          confidence:
            $ref: '#/components/schemas/Fraction'
          distribution:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/Fraction'
          regime:
            type: string
            enum:
            - TREND
            - RANGE
            - UNCERTAIN
          evidenceQuality:
            $ref: '#/components/schemas/Fraction'
          signalConflict:
            $ref: '#/components/schemas/Fraction'
          modelId:
            type: string
    TradeProposal:
      type: object
      additionalProperties: false
      required:
      - id
      - decisionId
      - marketStateId
      - instrument
      - target
      - quantity
      - createdAt
      - validUntil
      - traceId
      properties:
        id:
          type: string
        decisionId:
          type: string
        marketStateId:
          type: string
        instrument:
          type: string
        target:
          type: string
          enum:
          - LONG
          - FLAT
        quantity:
          $ref: '#/components/schemas/Decimal'
        rationaleCodes:
          type: array
          items:
            $ref: '#/components/schemas/ReasonCode'
        createdAt:
          $ref: '#/components/schemas/UtcTimestamp'
        validUntil:
          $ref: '#/components/schemas/UtcTimestamp'
        traceId:
          $ref: '#/components/schemas/TraceId'
    RiskDecision:
      type: object
      additionalProperties: false
      required:
      - id
      - proposalId
      - approved
      - reasonCode
      - reasonCodes
      - policyVersion
      - exposureSnapshot
      - decidedAt
      - validUntil
      - traceId
      properties:
        id:
          type: string
        proposalId:
          type: string
        approved:
          type: boolean
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'
        reasonCodes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReasonCode'
        policyVersion:
          type: integer
          minimum: 1
        exposureSnapshot:
          type: object
          additionalProperties: false
          required:
          - equity
          - grossNotional
          - reservedNotional
          properties:
            equity:
              $ref: '#/components/schemas/Decimal'
            grossNotional:
              $ref: '#/components/schemas/Decimal'
            reservedNotional:
              $ref: '#/components/schemas/Decimal'
        reservationId:
          type: string
        decidedAt:
          $ref: '#/components/schemas/UtcTimestamp'
        validUntil:
          $ref: '#/components/schemas/UtcTimestamp'
        traceId:
          $ref: '#/components/schemas/TraceId'
    Order:
      type: object
      additionalProperties: false
      required:
      - id
      - proposalId
      - riskDecisionId
      - instrument
      - status
      - requestedQuantity
      - filledQuantity
      - reconciliation
      - updatedAt
      - traceId
      properties:
        id:
          type: string
        proposalId:
          type: string
        riskDecisionId:
          type: string
        instrument:
          type: string
        status:
          type: string
          enum:
          - CREATED
          - RISK_RESERVED
          - SUBMITTING
          - ACKNOWLEDGED
          - PARTIALLY_FILLED
          - FILLED
          - REJECTED
          - CANCEL_PENDING
          - CANCELED
          - UNKNOWN
        requestedQuantity:
          $ref: '#/components/schemas/Decimal'
        filledQuantity:
          $ref: '#/components/schemas/Decimal'
        averageFillPrice:
          $ref: '#/components/schemas/Decimal'
        reconciliation:
          type: string
          enum:
          - CURRENT
          - PENDING
          - MISMATCH
        updatedAt:
          $ref: '#/components/schemas/UtcTimestamp'
        traceId:
          $ref: '#/components/schemas/TraceId'
    AuditEvent:
      type: object
      additionalProperties: false
      required:
      - id
