      - not:
          not:
            if:
              properties:
                denominator:
                  const: 0
              required:
              - denominator
              additionalProperties: true
            then:
              properties:
                status:
                  const: N/A
                numerator:
                  const: 0
              additionalProperties: true
            additionalProperties: true
