          const: urn:agentic-trading-lab:research-problem
        title:
          type: string
          const: Research request failed
        status:
          type: integer
          enum:
          - 400
          - 401
          - 403
          - 404
          - 409
          - 503
        code:
          $ref: '#/components/schemas/ResearchErrorCode'
        traceId:
          $ref: '#/components/schemas/TraceId'
    ResearchCursor:
      type: string
      minLength: 1
      maxLength: 2048
      pattern: ^[A-Za-z0-9_-]+$
      description: Authenticated opaque keyset cursor bound to resource, canonical filters, valuationAt, knowledgeAt,
        snapshotAt and committed snapshotVersion. Not a provider token. Invalid cursor:400 CURSOR_INVALID; changed filters:409
        SNAPSHOT_CONFLICT.
