    PaperTradeProposal:
      type: object
      additionalProperties: false
      required:
      - credentialGeneration
      - accountGeneration
      - policyVersion
      - profileVersion
      - limitPolicyVersion
      - symbol
      - side
      - quantity
      - limitPrice
      - orderType
      - timeInForce
      - session
      - currency
      - expiresAt
      - budgetVersion
      - riskBudget
      - proposalId
      - operationId
      - marketStateId
      - proposalSource
      - decisionId
      - humanRequestId
      - createdAt
      - traceId
      properties:
        credentialGeneration: &id006
          type: integer
          minimum: 1
          maximum: 9007199254740991
        accountGeneration: *id006
        policyVersion: *id006
        profileVersion: *id006
        limitPolicyVersion: *id006
        symbol:
          $ref: '#/components/schemas/PaperSymbol'
        side:
          type: string
          enum:
          - BUY
          - SELL
        quantity:
          $ref: '#/components/schemas/PaperQuantity'
        limitPrice:
          $ref: '#/components/schemas/PaperLimitPrice'
        orderType:
          type: string
          const: LIMIT
        timeInForce:
          type: string
          const: DAY
        session:
          type: string
          const: REGULAR
        currency:
          type: string
          const: USD
        expiresAt:
          type: string
          format: date-time
          pattern: Z$
          maxLength: 30
        budgetVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        riskBudget:
          $ref: '#/components/schemas/PositiveBudget'
        proposalId:
          type: string
          format: uuid
          maxLength: 36
        operationId:
          type: string
          format: uuid
          maxLength: 36
        marketStateId:
          type: string
          format: uuid
          maxLength: 36
        proposalSource:
          type: string
          enum:
          - MODEL_DECISION
          - HUMAN_REQUEST
        decisionId: &id007
          type:
          - string
          - 'null'
          format: uuid
          maxLength: 36
        humanRequestId: *id007
        createdAt:
          type: string
          format: date-time
          pattern: Z$
          maxLength: 30
        traceId:
          $ref: '#/components/schemas/TraceId'
      description: Immutable paper proposal with truthful exclusive provenance. Human proposals reference the durable
        human request without inventing a model decision. Domain validation binds every execution value, generation,
        policy/budget version and trace to the source; TTL may only narrow.
      if:
