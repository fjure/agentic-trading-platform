      - barId
      properties:
        kind:
          type: string
          enum:
          - BAR
        barId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    ResearchNewsContent:
