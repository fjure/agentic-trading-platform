          minLength: 1
          maxLength: 64
        region:
          type: string
          minLength: 1
          maxLength: 64
        actual:
          anyOf:
          - $ref: '#/components/schemas/ResearchDecimal'
          - type: 'null'
        unit:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 32
      if:
        properties:
