          $ref: '#/components/schemas/PaperOperationType'
        status:
          type: string
          enum:
          - ACCEPTED
          - RUNNING
          - SUCCEEDED
          - BLOCKED
          - FAILED
        idempotencyKey:
          type: string
          minLength: 16
          maxLength: 128
          pattern: ^[A-Za-z0-9._:-]+$
        acceptedGeneration: *id002
        acceptedAt: *id003
        updatedAt: *id003
        traceId:
          $ref: '#/components/schemas/TraceId'
        errorCode:
          $ref: '#/components/schemas/PaperErrorCode'
        orderId: *id001
      description: Persisted asynchronous command projection. ACCEPTED is durable receipt only, never trading approval
        or proof of broker success. CANCEL_ORDER may remain RUNNING while its order is CANCEL_PENDING; reservations
        remain until terminal reconciliation. Idempotent replay never creates a second obligation.
      if:
        properties:
          status:
            enum:
            - BLOCKED
            - FAILED
      then:
        required:
        - errorCode
        properties:
          errorCode:
            $ref: '#/components/schemas/PaperErrorCode'
      else:
        not:
          required:
          - errorCode
          properties:
            errorCode:
              $ref: '#/components/schemas/PaperErrorCode'
