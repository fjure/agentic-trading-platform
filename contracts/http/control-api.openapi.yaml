        bar:
          $ref: '#/components/schemas/BacktestBarIdentity'
        contentFingerprint:
          $ref: '#/components/schemas/ReadinessHash'
        revision:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - kind
          - id
          - revision
          - fingerprint
          properties:
            kind:
              $ref: '#/components/schemas/ReadinessSafeReferenceKind'
            id:
