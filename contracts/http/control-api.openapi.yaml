    ResearchDerivedContent:
      type: object
      additionalProperties: false
      required:
      - kind
      - metric
      - value
      - algorithmVersion
      - evidenceIds
      properties:
        kind:
          type: string
          enum:
          - DERIVED
        metric:
          type: string
          enum:
          - PRICE_CHANGE
          - VOLATILITY
        value:
          $ref: '#/components/schemas/ResearchDecimal'
        algorithmVersion:
          type: string
          enum:
          - decimal-population-v1
        evidenceIds:
          type: array
          maxItems: 200
          items:
            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    ResearchEvidenceContent:
      oneOf:
      - $ref: '#/components/schemas/ResearchBarContent'
