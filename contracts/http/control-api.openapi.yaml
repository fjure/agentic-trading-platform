openapi: 3.1.2
info:
  title: Agentic Trading Lab local control API
  version: 1.0.0
  description: Canonical planning contract for the local, paper-only supervisor. No broker submit, provider raw
    payload, credential, or live-mode operation is exposed. The contract does not assert that a runtime implementation
    exists.
servers:
- url: http://127.0.0.1:8000
  description: Loopback only; deployment must reject non-loopback bind and untrusted Origin.
security:
- LocalSession: []
tags:
- name: Snapshot
  description: Atomic current supervisor state.
- name: Stream
  description: Retained sanitized live updates.
- name: Control
  description: Local operating controls.
- name: Risk policy
  description: Versioned simulation limits.
- name: History
  description: Paginated audit and trading history.
- name: Paper
  description: Isolated Alpaca paper workflow, without credentials or direct broker access.
- name: Research
  description: Stored conservative research evidence and bounded ingestion, without trading permission.
- name: Backtesting
  description: Bounded deterministic local simulation without trading permission.
paths:
  /health:
    get:
      tags:
      - Control
      operationId: getRuntimeHealth
      security: []
      summary: Read local process liveness and sanitized dependency checks
      description: No session required. Actual transport and peer must be loopback; canonical public Host and optional
        Origin remain mandatory boundaries and forwarding headers are rejected. A live process returns HEALTHY even
        when a dependency is unavailable. This never grants trading permission.
      responses:
        '200':
          description: Process is alive; dependency checks may be unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeHealth'
              example:
                status: HEALTHY
                checks:
                  DATABASE: UNAVAILABLE
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /ready:
    get:
      tags:
      - Control
      operationId: getRuntimeReadiness
      security: []
      summary: Read local database readiness and sanitized dependency checks
      description: Same strict loopback and Host/Origin boundaries as /health, without a session. HTTP 200 depends
        only on DATABASE being HEALTHY; optional decision or market failures cannot disable safety controls or reconciliation.
        Readiness never grants trading permission.
      responses:
        '200':
          description: Database is ready; other dependency checks may remain degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeHealth'
              example:
                status: DEGRADED
                checks:
                  DATABASE: HEALTHY
                  DECISION: UNAVAILABLE
        '503':
          description: Database readiness unavailable; contains only bounded health codes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeHealth'
              example:
                status: UNAVAILABLE
                checks:
                  DATABASE: UNAVAILABLE
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /api/v1/session:
    post:
      tags:
      - Control
      operationId: activateLocalSession
      summary: Exchange a one-time local launcher code for an HttpOnly session
      description: The trusted local launcher displays a random, single-use activation code to the operator, never
        in a URL or log. The same-origin form posts it over loopback; the server checks Host and Origin, expires
        the code within five minutes, rate limits attempts, and sets an HttpOnly SameSite=Strict cookie. No broker
        or Jev credential is involved. Browser writes require the session, exact same Origin, JSON content type,
        and CSRF protection. This is a planning contract only.
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateSessionRequest'
      responses:
        '204':
          description: Local operator session created; code immediately consumed.
          headers:
            Set-Cookie:
              description: HttpOnly SameSite=Strict local session; Secure when TLS is used.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /api/v1/snapshot:
    get:
      tags:
      - Snapshot
      operationId: getSupervisorSnapshot
      summary: Read an atomic supervisor view and the cursor to continue from it
      description: Cursor marks the last event included at the atomic snapshot boundary; SSE resumes strictly after
        it. If the stream later reports CURSOR_EXPIRED, discard cached state and fetch a new snapshot.
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Current sanitized supervisor state and event cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisorSnapshot'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /api/v1/events:
    get:
      tags:
      - Stream
      operationId: streamSupervisorEvents
      summary: Resume sanitized supervisor events using SSE
      x-event-schema:
        $ref: '#/components/schemas/SupervisorEvent'
      description: 'The client first reads /snapshot, then connects with that response''s cursor. Last-Event-ID
        takes precedence over the cursor query when both are supplied. Each data frame is one SupervisorEvent JSON
        value; id is the event cursor, event is its versioned eventType. Events can be redelivered; clients deduplicate
        by eventId and apply monotonically increasing aggregateVersion. A comment heartbeat (`: heartbeat`) is sent
        at most every 15 seconds while idle and carries no state. Reconnect uses Last-Event-ID. Expired/unknown
        cursor returns HTTP 410 problem+json before the stream opens; midstream interruption requires a reconnect,
        which either replays all retained events or returns 410. If a gap is detected after streaming begins, emit
        `event: reset-required` with a sanitized CURSOR_EXPIRED problem JSON payload, then close; the client fetches
        a fresh snapshot. Retention defaults to seven days. A missing heartbeat for 45 seconds marks the client
        connection stale. The server must never silently skip a gap. Events are at-least-once and ordered by cursor,
        not necessarily by aggregate. Browser EventSource cannot attach arbitrary headers; authentication must use
        a same-origin, HttpOnly local session cookie.'
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - name: Last-Event-ID
        in: header
        description: Opaque cursor from the last delivered SSE id.
        schema:
          $ref: '#/components/schemas/Cursor'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Event stream; each data frame validates as SupervisorEvent.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            text/event-stream:
              schema:
                type: string
              example: 'id: c_000123

                event: order.updated.v1

                data: {"eventId":"evt_123","eventType":"order.updated.v1","occurredAt":"2026-10-12T10:00:00Z","aggregateId":"ord_1","aggregateVersion":2,"traceId":"4bf92f3577b34da6a3ce929d0e0e4736","cursor":"c_000123","payload":{"orderId":"ord_1","status":"UNKNOWN"}}


                '
        '410':
          $ref: '#/components/responses/CursorExpired'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /api/v1/mode:
    get:
      tags:
      - Control
      operationId: getMode
      summary: Read the effective mode and safety controls
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Effective operating mode and pause state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModeState'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
    put:
      tags:
      - Control
      operationId: setMode
      summary: Request DISABLED, REPLAY, SHADOW, or PAPER
      description: PAPER requires explicit health and reconciliation success. LIVE is absent from the schema and
        must be rejected at every layer. No mode directly submits orders.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetModeRequest'
      responses:
        '200':
          description: Result, also returned for a valid replay of the idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModeState'
        '409':
          $ref: '#/components/responses/Refused'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /api/v1/control/pause:
    post:
      tags:
      - Control
      operationId: pauseNewEntries
      summary: Immediately block new entries independent of decision or dashboard health
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlReason'
      responses:
        '200':
          description: Effective control state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModeState'
              example:
                mode: PAPER
                pauseNew: true
                killSwitch: false
                health: HEALTHY
                reconciliation: CURRENT
                changedAt: '2026-10-12T10:00:00Z'
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '409':
          $ref: '#/components/responses/Refused'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /api/v1/control/resume:
    post:
      tags:
      - Control
      operationId: resumeNewEntries
      summary: Resume only after explicit health and reconciliation checks
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlReason'
      responses:
        '200':
          description: Effective control state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModeState'
        '409':
          $ref: '#/components/responses/Refused'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /api/v1/control/kill:
    post:
      tags:
      - Control
      operationId: activateKillSwitch
      summary: Latch the independent kill switch; no API route clears it
      description: Recovery requires the separately documented operator runbook.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlReason'
      responses:
        '200':
          description: Effective control state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModeState'
        '409':
          $ref: '#/components/responses/Refused'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /api/v1/risk-policy:
    get:
      tags:
      - Risk policy
      operationId: getRiskPolicy
      summary: Read the versioned paper risk policy
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Versioned simulation limits
          headers:
            ETag:
              description: Opaque strong version token for If-Match.
              schema:
                type: string
                example: '"risk-policy-v3"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskPolicy'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
    put:
      tags:
      - Risk policy
      operationId: updateRiskPolicy
      summary: Replace the complete validated paper risk policy
      description: Check the actor/operation/idempotency-key record before evaluating If-Match, so an exact retry
        returns the original result even after ETag advancement. A new key with an old ETag receives 412.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskPolicyUpdate'
      responses:
        '200':
          description: Updated policy with next version token
          headers:
            ETag:
              schema:
                type: string
                example: '"risk-policy-v4"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskPolicy'
        '409':
          $ref: '#/components/responses/Refused'
        '412':
          $ref: '#/components/responses/VersionConflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /api/v1/market-states:
    get:
      tags:
      - History
      operationId: listMarketStates
      summary: List recent normalized market states
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Cursor page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketStatePage'
        '410':
          $ref: '#/components/responses/CursorExpired'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
  /api/v1/decisions:
    get:
      tags:
      - History
      operationId: listDecisions
      summary: List versioned decision results
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Cursor page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionPage'
        '410':
          $ref: '#/components/responses/CursorExpired'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
  /api/v1/proposals:
    get:
      tags:
      - History
      operationId: listProposals
      summary: List trade proposals
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Cursor page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalPage'
        '410':
          $ref: '#/components/responses/CursorExpired'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
  /api/v1/risk-decisions:
    get:
      tags:
      - History
      operationId: listRiskDecisions
      summary: List deterministic risk decisions
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Cursor page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskDecisionPage'
        '410':
          $ref: '#/components/responses/CursorExpired'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
  /api/v1/orders:
    get:
      tags:
      - History
      operationId: listOrders
      summary: List internal paper order states
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Cursor page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '410':
          $ref: '#/components/responses/CursorExpired'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
  /api/v1/audit:
    get:
      tags:
      - History
      operationId: listAuditEvents
      summary: List audit entries, optionally by trace ID
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Traceparent'
      - name: traceId
        in: query
        description: Filter to one business trace.
        schema:
          $ref: '#/components/schemas/TraceId'
      responses:
        '200':
          description: Cursor page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '410':
          $ref: '#/components/responses/CursorExpired'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
  /api/v1/runs:
    get:
      tags:
      - History
      operationId: listAgentRuns
      summary: List agent and worker runs
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Cursor page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunPage'
        '410':
          $ref: '#/components/responses/CursorExpired'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
  /api/v1/costs:
    get:
      tags:
      - History
      operationId: listApiCosts
      summary: List available API and token costs
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Cursor page; unknown provider cost is null, not zero
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostPage'
        '410':
          $ref: '#/components/responses/CursorExpired'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
  /api/v1/demo/runs:
    get:
      tags:
      - Demo
      operationId: listDemoRuns
      summary: List isolated simulation runs
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoRunPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '409':
          $ref: '#/components/responses/Refused'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
    post:
      tags:
      - Demo
      operationId: createDemoRun
      summary: Start an isolated, finite simulation
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoRun'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '409':
          $ref: '#/components/responses/Refused'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoRunCreateRequest'
  /api/v1/demo/runs/{runId}:
    get:
      tags:
      - Demo
      operationId: getDemoRun
      summary: Read public simulation run status
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoRun'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '409':
          $ref: '#/components/responses/Refused'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
  /api/v1/demo/runs/{runId}/snapshot:
    get:
      tags:
      - Demo
      operationId: getDemoSnapshot
      summary: Read isolated demo supervisor snapshot
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisorSnapshot'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '409':
          $ref: '#/components/responses/Refused'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
  /api/v1/demo/runs/{runId}/history/{resource}:
    get:
      tags:
      - Demo
      operationId: getDemoHistory
      summary: Read a page of isolated demo history
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: resource
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/DemoHistoryResource'
      - name: cursor
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Cursor'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoHistoryPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '409':
          $ref: '#/components/responses/Refused'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
  /api/v1/demo/runs/{runId}/controls/{action}:
    post:
      tags:
      - Demo
      operationId: controlDemoRun
      summary: Pause or kill an isolated demo run
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Traceparent'
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum:
          - pause
          - kill
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoRunControlResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '409':
          $ref: '#/components/responses/Refused'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
      requestBody:
        required: true
