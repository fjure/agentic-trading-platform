        observedAt:
          $ref: '#/components/schemas/PaperReadTimestamp'
        validUntil:
          $ref: '#/components/schemas/PaperReadTimestamp'
        limitOrderConfirmed:
          type: boolean
        fractionalConfirmed:
          type: boolean
        quantityStep:
          $ref: '#/components/schemas/PaperReadPositiveDecimal'
        priceTick:
          $ref: '#/components/schemas/PaperReadPositiveDecimal'
    PaperSessionEvidence:
      type: object
