        action:
          type: string
        outcome:
          type: string
          enum:
          - ACCEPTED
          - REFUSED
          - OBSERVED
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'
        policyVersion:
          type: integer
          minimum: 1
        traceId:
          $ref: '#/components/schemas/TraceId'
    AgentRun:
      type: object
      additionalProperties: false
      required:
      - id
      - role
      - status
      - startedAt
      - heartbeatAt
      - traceId
      properties:
        id:
          type: string
        role:
          type: string
          enum:
