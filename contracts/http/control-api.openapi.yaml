    PaperErrorCode:
      type: string
      enum:
      - INVALID_REQUEST
      - AUTHENTICATION_REQUIRED
      - ORIGIN_REJECTED
      - IDEMPOTENCY_CONFLICT
      - OPERATION_NOT_FOUND
      - ORDER_NOT_FOUND
      - VERSION_CONFLICT
      - CREDENTIALS_MISSING
      - CREDENTIALS_INVALID
      - ACCOUNT_IDENTITY_MISMATCH
      - ACCOUNT_BLOCKED
      - CURRENCY_UNSUPPORTED
      - MARKET_DATA_UNAVAILABLE
      - OPEN_ORDERS_PRESENT
      - UNSUPPORTED_POSITION
      - COST_BASIS_MISSING
      - SNAPSHOT_CHANGED
      - LEDGER_ALREADY_BOUND
      - LEDGER_NOT_PREPARED
      - CONNECTION_NOT_VERIFIED
      - APPROVAL_EXPIRED
      - ENTRY_PAUSED
      - KILL_SWITCH_ACTIVE
      - SESSION_CLOSED
      - STALE_QUOTE
      - CAPABILITY_UNCONFIRMED
      - BUDGET_EXCEEDED
      - INSUFFICIENT_POSITION
      - MINIMUM_QUANTITY
      - POLICY_MISMATCH
      - RECONCILIATION_REQUIRED
      - BROKER_STATUS_UNKNOWN
      - EXTERNAL_ACTIVITY
      - PROVIDER_RATE_LIMITED
      - PROVIDER_UNAVAILABLE
      - PROVIDER_REJECTED
      - TEMPORARILY_UNAVAILABLE
      description: Stable allowlisted public failure code. Never contains provider text, credentials, account UUID,
        paths or exception messages.
    PaperOperationType:
      type: string
      enum:
      - VERIFY_CONNECTION
      - PREPARE_LEDGER
      - START
      - PAUSE
      - STOP
      - KILL
      - PLACE_LIMIT_ORDER
      - CANCEL_ORDER
    PaperSymbol:
      type: string
      enum:
      - SPY
      - QQQ
    PaperQuantity:
      type: string
      maxLength: 30
      pattern: ^(?=.*[1-9])(?:0|[1-9][0-9]{0,19})(?:\.[0-9]{1,9})?$
      description: Strictly positive exact decimal shares; at most nine fractional digits. Fractional DAY LIMIT
        additionally requires fresh certified asset capability.
    PaperLimitPrice:
      type: string
      maxLength: 28
      pattern: ^(?=.*[1-9])(?:0|[1-9][0-9]{0,19})(?:\.[0-9]{1,6})?$
      description: Positive exact USD price; current asset tick policy is checked before planning.
    PaperGenerationRequest:
      type: object
      additionalProperties: false
      required:
      - credentialGeneration
      - accountGeneration
      properties:
        credentialGeneration: &id002
          type: integer
          minimum: 1
          maximum: 9007199254740991
        accountGeneration: *id002
    PaperVerifyRequest:
      type: object
      additionalProperties: false
      required:
      - credentialGeneration
      properties:
        credentialGeneration: *id002
    PaperPrepareRequest:
      type: object
      additionalProperties: false
      required:
      - credentialGeneration
      - accountGeneration
      - verificationOperationId
      properties:
        credentialGeneration: *id002
        accountGeneration: *id002
        verificationOperationId: *id001
    PaperStartRequest:
      type: object
      additionalProperties: false
      required:
      - credentialGeneration
      - accountGeneration
      - policyVersion
      - profileVersion
      - limitPolicyVersion
      - symbols
      - expiresAt
      - riskBudget
      - currency
      - strategy
      - confirmation
      - budgetVersion
      properties:
        credentialGeneration: *id002
        accountGeneration: *id002
        policyVersion: *id002
        profileVersion: *id002
        limitPolicyVersion: *id002
        symbols:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/PaperSymbol'
          not:
            not:
              uniqueItems: true
          description: JSON array with unique elements. Double negation preserves JSON Schema uniqueness while the
            pinned Angular generator retains the array wire type.
        expiresAt: &id003
          type: string
          format: date-time
          pattern: Z$
          maxLength: 30
        riskBudget:
          $ref: '#/components/schemas/PositiveBudget'
        currency:
          type: string
          const: USD
        strategy:
          type: string
          enum:
          - mock-neutral
          - neutral-baseline
          - jev
        confirmation:
          type: string
          const: START_PAPER
        budgetVersion: &id004
          type: integer
          minimum: 1
          maximum: 9007199254740991
    PaperControlRequest:
      type: object
      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - PAUSE
          - STOP
          - KILL
      description: Safety controls are independent of setup, credential, policy and provider readiness. PAUSE/KILL
        durably close the entry latch before acknowledgement. STOP also ends strategy planning; recovery continues.
        None liquidates holdings.
    PaperLimitOrderRequest:
      type: object
      additionalProperties: false
      required:
      - credentialGeneration
      - accountGeneration
      - policyVersion
      - profileVersion
      - limitPolicyVersion
      - symbol
      - side
      - quantity
      - limitPrice
      - orderType
      - timeInForce
      - session
      - currency
      - expiresAt
      - confirmation
      - budgetVersion
      - riskBudget
      properties:
        credentialGeneration: *id002
        accountGeneration: *id002
        policyVersion: *id002
        profileVersion: *id002
        limitPolicyVersion: *id002
        symbol:
          $ref: '#/components/schemas/PaperSymbol'
        side:
          type: string
          enum:
          - BUY
          - SELL
        quantity:
          $ref: '#/components/schemas/PaperQuantity'
        limitPrice:
          $ref: '#/components/schemas/PaperLimitPrice'
        orderType:
          type: string
          const: LIMIT
        timeInForce:
          type: string
          const: DAY
        session:
          type: string
          const: REGULAR
        currency:
          type: string
          const: USD
        expiresAt: *id003
        confirmation:
          type: string
          const: PLACE_PAPER_LIMIT
        budgetVersion: *id004
        riskBudget:
          $ref: '#/components/schemas/PositiveBudget'
      description: Immutable human request; no direct broker submit. Uses the shared deterministic proposal, risk,
        reservation and execution path. SELL cannot exceed free long holdings. Server binds request ID and trace;
        no synthetic model decision. No notional, MARKET or fallback order.
    PaperCancelRequest:
      type: object
      additionalProperties: false
      required:
      - accountGeneration
      - confirmation
      properties:
        accountGeneration: *id002
        confirmation:
          type: string
          const: CANCEL_PAPER_ORDER
    PaperOperation:
      type: object
      additionalProperties: false
      required:
      - operationId
      - operationType
      - status
      - idempotencyKey
      - acceptedGeneration
      - acceptedAt
      - updatedAt
      - traceId
      properties:
        operationId: *id001
        operationType:
          $ref: '#/components/schemas/PaperOperationType'
        status:
          type: string
          enum:
          - ACCEPTED
          - RUNNING
          - SUCCEEDED
          - BLOCKED
          - FAILED
        idempotencyKey:
          type: string
          minLength: 16
          maxLength: 128
          pattern: ^[A-Za-z0-9._:-]+$
        acceptedGeneration: *id002
        acceptedAt: *id003
        updatedAt: *id003
        traceId:
          $ref: '#/components/schemas/TraceId'
        errorCode:
          $ref: '#/components/schemas/PaperErrorCode'
        orderId: *id001
      description: Persisted asynchronous command projection. ACCEPTED is durable receipt only, never trading approval
        or proof of broker success. CANCEL_ORDER may remain RUNNING while its order is CANCEL_PENDING; reservations
        remain until terminal reconciliation. Idempotent replay never creates a second obligation.
      if:
        properties:
          status:
            enum:
            - BLOCKED
            - FAILED
      then:
        required:
        - errorCode
        properties:
          errorCode:
            $ref: '#/components/schemas/PaperErrorCode'
      else:
        not:
          required:
          - errorCode
          properties:
            errorCode:
              $ref: '#/components/schemas/PaperErrorCode'
    PaperStatus:
      type: object
      additionalProperties: false
      required:
      - namespace
      - environment
      - setupState
      - operatingState
      - entryGateOpen
      - credentialGeneration
      - accountGeneration
      - accountLabel
      - currency
      - verifiedAt
      - reconciledAt
      - observedAt
      - marketDataFeed
      - providerVerification
      - blockers
      - traceId
      properties:
        namespace:
          type: string
          const: alpaca-paper
        environment:
          type: string
          const: PAPER
        setupState:
          type: string
          enum:
          - NOT_CONFIGURED
          - SAVED
          - VERIFIED
          - PREPARED
        operatingState:
          type: string
          enum:
          - DISABLED
          - PAUSED
          - RUNNING
          - STOPPED
          - HALTED
        entryGateOpen:
          type: boolean
        credentialGeneration:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        accountGeneration:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        accountLabel:
          type:
          - string
          - 'null'
          pattern: ^paper-[0-9a-f]{8}$
          maxLength: 14
        currency:
          type: string
          const: USD
        cash:
          $ref: '#/components/schemas/Decimal'
        riskBudget:
          $ref: '#/components/schemas/PositiveBudget'
        verifiedAt: &id005
          type:
          - string
          - 'null'
          format: date-time
          pattern: Z$
          maxLength: 30
        reconciledAt: *id005
        observedAt: *id003
        marketDataFeed:
          type: string
          enum:
          - UNVERIFIED
          - IEX
          - SIP
        providerVerification:
          type: string
          enum:
          - UNVERIFIED
          - CONFIRMED
        blockers:
          type: array
          maxItems: 37
          items:
            $ref: '#/components/schemas/PaperErrorCode'
          not:
            not:
              uniqueItems: true
          description: JSON array with unique elements. Double negation preserves JSON Schema uniqueness while the
            pinned Angular generator retains the array wire type.
        traceId:
          $ref: '#/components/schemas/TraceId'
      if:
        properties:
          entryGateOpen:
            const: true
      then:
        properties:
          setupState:
            const: PREPARED
          operatingState:
            const: RUNNING
          providerVerification:
            const: CONFIRMED
          blockers:
            maxItems: 0
    PaperProblem:
      type: object
