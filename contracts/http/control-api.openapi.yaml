      - scope
      - deadlineSeconds
      - firstBar
      - lastBar
      - period
      - expectedBars
      - foldIndex
      - snapshot
      - policyVersion
      - leftBoundary
      - rightBoundary
      - references
      properties:
        kind:
          type: string
          enum:
          - BAR_OBSERVATION
          - STRICT_PIT
          - COMPLETE_EXPERIMENT
        scope:
          type: string
          enum:
          - SIGNAL
          - OUTCOME
          - SIGNAL_AND_OUTCOME
        deadlineSeconds:
          type: integer
          enum:
          - 60
          - 300
        firstBar:
          $ref: '#/components/schemas/BacktestBarIdentity'
        lastBar:
          $ref: '#/components/schemas/BacktestBarIdentity'
        period:
          $ref: '#/components/schemas/ReadinessInterval'
        expectedBars:
          type: integer
          minimum: 1
          maximum: 100000
        foldIndex:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 11
        snapshot:
          $ref: '#/components/schemas/ReadinessSnapshot'
        policyVersion:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$(?![\s\S])
        leftBoundary:
          $ref: '#/components/schemas/ReadinessWindowBoundary'
        rightBoundary:
          $ref: '#/components/schemas/ReadinessWindowBoundary'
        references:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ReadinessSafeReference'
      description: Tatsächlich beobachtete maximal zusammenhängende kalendergeordnete Bars, keine Prognose. Damals
        sichtbare reguläre New-York-Sitzungen, DST, Feiertage und Early Close bestimmen die UTC-Reihenfolge. Unbekannter
        Kalender sowie verspätete, fehlende oder ungültige Bars unterbrechen Läufe. STRICT_PIT verwendet zusätzlich
        die gemeinsamen Qualitäts-, Revisions-, Snapshot- und Kapitalmaßnahmenregeln des Backtests. Signal-Warm-up
        wird am Signalwissenszeitpunkt geprüft, nicht pauschal an der eigenen Frist der Warm-up-Bar. Kein Verschieben
        des Foldstarts; Coverage muss bereits warmStart bis fold.testEnd belegen. Outcomes erweitern kein Signalwissen;
        COMPLETE_EXPERIMENT benötigt beide Fristen und alle Protokollprüfungen.
      allOf:
      - not:
          not:
            if:
              properties:
                scope:
                  const: SIGNAL
              required:
              - scope
              additionalProperties: true
            then:
              properties:
                deadlineSeconds:
                  const: 60
              additionalProperties: true
            additionalProperties: true
      - not:
          not:
            if:
              properties:
                scope:
                  const: OUTCOME
              required:
              - scope
              additionalProperties: true
            then:
              properties:
                deadlineSeconds:
                  const: 300
              additionalProperties: true
            additionalProperties: true
      - not:
          not:
            if:
              properties:
                kind:
                  const: COMPLETE_EXPERIMENT
              required:
              - kind
              additionalProperties: true
            then:
              properties:
                scope:
                  const: SIGNAL_AND_OUTCOME
              additionalProperties: true
            additionalProperties: true
