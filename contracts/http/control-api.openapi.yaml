          maxItems: 200
          items:
            $ref: '#/components/schemas/ReadinessTimelinessMetrics'
        windows:
          $ref: '#/components/schemas/ReadinessWindows'
        providerRights:
          $ref: '#/components/schemas/ReadinessProviderRights'
        limits:
          $ref: '#/components/schemas/ReadinessLimits'
      description: 'Unveränderliche Veröffentlichung einschließlich Hashes und ursprünglicher Zulässigkeit. Aggregation:
        bekannter Pflichtblocker ergibt BLOCKED, sonst unbekannter Pflichtbeleg UNKNOWN, sonst ungeprüfter Pflichtbereich
        NOT_EVALUATED, sonst ELIGIBLE. Positive Ergebnisse benötigen vollständige Prüfungen und Fenster; SUCCEEDED
        bedeutet nur abgeschlossene Diagnose. Backtests binden und prüfen ihren eigenen Snapshot und aktuellen
        Vertrauensstand; ein Bericht ist niemals ein Freigabetoken.'
      allOf:
      - not:
          not:
            if:
              properties:
                eligibility:
                  const: ELIGIBLE
              required:
              - eligibility
              additionalProperties: true
            then:
              properties:
                evaluationComplete:
                  const: true
                windows:
                  properties:
                    complete:
                      const: true
                  additionalProperties: true
              additionalProperties: true
            additionalProperties: true
      - not:
          not:
            if:
              properties:
                eligibility:
                  const: ELIGIBLE
              required:
              - eligibility
              additionalProperties: true
            then:
              properties:
                trust:
                  properties:
                    integrity:
                      properties:
                        status:
                          const: VERIFIED
                      additionalProperties: true
                    sourceAuthenticity:
                      properties:
                        status:
                          const: VERIFIED
                      additionalProperties: true
                    temporalAuthenticity:
                      properties:
                        status:
                          const: VERIFIED
                      additionalProperties: true
                    completeness:
                      properties:
                        status:
                          const: VERIFIED
                      additionalProperties: true
                    domainQuality:
                      properties:
                        status:
                          const: VERIFIED
                      additionalProperties: true
                  additionalProperties: true
              additionalProperties: true
            additionalProperties: true
