          type: string
          enum:
          - EXPECTED_BAR_IDENTITIES
          - OBSERVED_BAR_IDENTITIES
          - USABLE_BAR_OCCURRENCES
        unknownCount:
          type: integer
          minimum: 0
          maximum: 100000
      description: Absolute Zähler und Nenner, kein gerundeter Prozentsatz. Nullnenner erfordert N/A und numerator=0.
        Unbekannter Kalender verhindert Vollständigkeitsbehauptungen. Eindeutige Baridentitäten deduplizieren Revisionen
        und Receipts; die Metrikbildung erzwingt numerator <= denominator.
