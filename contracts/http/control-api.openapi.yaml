        traceId:
          $ref: '#/components/schemas/TraceId'
    SupervisorEvent:
      type: object
      additionalProperties: false
      required:
      - eventId
      - eventType
      - occurredAt
      - aggregateId
      - aggregateVersion
      - traceId
      - cursor
      - payload
      properties:
        eventId:
          type: string
        eventType:
          type: string
          pattern: ^[a-z]+\.[a-z]+\.v[1-9][0-9]*$
        occurredAt:
          $ref: '#/components/schemas/UtcTimestamp'
        aggregateId:
          type: string
        aggregateVersion:
          type: integer
          minimum: 1
        traceId:
          $ref: '#/components/schemas/TraceId'
        cursor:
          $ref: '#/components/schemas/Cursor'
        payload:
          type: object
          description: Sanitized versioned internal event data.
    SupervisorSnapshot:
      type: object
      additionalProperties: false
      required:
      - asOf
      - cursor
      - mode
      - paperAccount
      - connections
      - portfolioEquity
      - workers
      - recentOrders
      properties:
        asOf:
          $ref: '#/components/schemas/UtcTimestamp'
        cursor:
          $ref: '#/components/schemas/Cursor'
        mode:
          $ref: '#/components/schemas/ModeState'
        paperAccount:
          type: string
          description: Non-sensitive local alias only.
        connections:
          type: object
          additionalProperties:
            type: string
            enum:
            - HEALTHY
            - DEGRADED
            - UNAVAILABLE
        portfolioEquity:
          $ref: '#/components/schemas/Decimal'
        portfolioCash:
          $ref: '#/components/schemas/Decimal'
          description: Current cash for this ledger; demo responses carry the isolated demo ledger balance.
        positions:
          type: array
          description: Current positions in the same ledger as portfolioEquity and portfolioCash.
          items:
            type: object
            additionalProperties: false
            required: [instrument, quantity]
            properties:
              instrument:
                type: string
              quantity:
                $ref: '#/components/schemas/Decimal'
              averagePrice:
                $ref: '#/components/schemas/Decimal'
        workers:
          type: array
          items:
            $ref: '#/components/schemas/AgentRun'
        recentOrders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
