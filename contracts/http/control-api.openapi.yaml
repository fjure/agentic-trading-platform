        ledgerVersion:
          $ref: '#/components/schemas/PaperReadVersion'
      description: Stored position. costBasis is the exact matching ledger-version cost-basis evidence, or null; never
        quantity multiplied by the rounded average price.
    PaperQuoteEvidence:
      type: object
      additionalProperties: false
      required:
      - quoteId
      - sourceId
      - bid
      - ask
      - observedAt
      - providerTime
      - validUntil
      - sourceCapabilityVersion
