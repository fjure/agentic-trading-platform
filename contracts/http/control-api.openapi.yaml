      - currency
      - amount
      - traceId
      properties:
        id:
          type: string
        provider:
          type: string
        observedAt:
          $ref: '#/components/schemas/UtcTimestamp'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        amount:
          oneOf:
          - $ref: '#/components/schemas/Decimal'
