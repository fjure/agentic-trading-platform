        interval:
          $ref: '#/components/schemas/ResearchInterval'
        adjustment:
          type: string
          enum:
          - raw
        currency:
          type: string
          enum:
          - USD
        start:
          $ref: '#/components/schemas/ResearchTimestamp'
        end:
          $ref: '#/components/schemas/ResearchTimestamp'
        open:
          $ref: '#/components/schemas/ResearchDecimal'
        high:
          $ref: '#/components/schemas/ResearchDecimal'
        low:
          $ref: '#/components/schemas/ResearchDecimal'
        close:
          $ref: '#/components/schemas/ResearchDecimal'
        volume:
          $ref: '#/components/schemas/ResearchDecimal'
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        predecessorId:
          anyOf:
          - type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          - type: 'null'
        providerRevision:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
        eventTime:
          $ref: '#/components/schemas/ResearchTimestamp'
        publishedAt:
          anyOf:
          - $ref: '#/components/schemas/ResearchTimestamp'
          - type: 'null'
        availableAt:
          $ref: '#/components/schemas/ResearchTimestamp'
        ingestedAt:
          $ref: '#/components/schemas/ResearchTimestamp'
        availabilityBasis:
          type: string
          enum:
          - FIRST_OBSERVED
        fingerprint:
          $ref: '#/components/schemas/ResearchFingerprint'
        evidenceId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        quality:
          $ref: '#/components/schemas/ResearchQuality'
        commitVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      description: 'Immutable raw revision. Natural identity includes instrument/provider/feed/interval/start/end/adjustment.
        Prices positive and high>=max(open,close,low), low<=min(open,close); volume>=0. FIRST_OBSERVED: publishedAt=null
        and availableAt=ingestedAt; eventTime=end. Cross-field rules are validated by domain/runtime, not JSON Schema.'
    ResearchBarContent:
      type: object
      additionalProperties: false
      required:
