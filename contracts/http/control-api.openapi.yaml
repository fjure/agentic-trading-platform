                    properties:
                      LONG:
                        $ref: '#/components/schemas/Fraction'
                      FLAT:
                        $ref: '#/components/schemas/Fraction'
                      ABSTAIN:
                        $ref: '#/components/schemas/Fraction'
          confidence:
            $ref: '#/components/schemas/Fraction'
          distribution:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/Fraction'
          regime:
            type: string
            enum:
