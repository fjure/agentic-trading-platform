          enum:
          - BAR
          - NEWS
          - FUNDAMENTAL
          - MACRO_EVENT
          - REGIME
        state:
          type: string
          enum:
          - IMPLEMENTED
          - DISABLED
          - BLOCKED
          - NOT_IMPLEMENTED
        licenseStatus:
          $ref: '#/components/schemas/ResearchLicenseStatus'
        policyVersion:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 64
          - type: 'null'
        providerVerification:
          type: string
          enum:
          - UNVERIFIED
          - VERIFIED
          - BLOCKED
        instruments:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/ResearchInstrument'
        intervals:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/ResearchInterval'
        feed:
          anyOf:
          - type: string
            enum:
            - iex
          - type: 'null'
        adjustment:
          anyOf:
          - type: string
            enum:
            - raw
          - type: 'null'
        historyStart:
          anyOf:
          - $ref: '#/components/schemas/ResearchTimestamp'
          - type: 'null'
        historyEnd:
          anyOf:
          - $ref: '#/components/schemas/ResearchTimestamp'
          - type: 'null'
        limitations:
