        averagePrice:
          type:
          - string
          - 'null'
          maxLength: 39
          pattern: ^(?=.*[1-9])(0|[1-9][0-9]{0,19})(\.[0-9]{1,18})?$
        costBasis:
          type:
          - string
          - 'null'
          maxLength: 39
