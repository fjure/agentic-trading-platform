              minLength: 1
              maxLength: 80
              pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$(?![\s\S])
            fingerprint:
              type:
              - string
              - 'null'
              pattern: ^[0-9a-f]{64}$(?![\s\S])
          description: Ausschließlich opake, zugelassene lokale Referenz; keine URL, kein Dateipfad, Rohinhalt,
            Zugangsschlüssel, Zertifikat oder personenbezogener Identifikator.
        predecessor:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - kind
          - id
          - revision
          - fingerprint
          properties:
            kind:
              $ref: '#/components/schemas/ReadinessSafeReferenceKind'
            id:
              type: string
              minLength: 1
              maxLength: 128
              pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$(?![\s\S])
            revision:
              type:
              - string
              - 'null'
              minLength: 1
              maxLength: 80
              pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$(?![\s\S])
            fingerprint:
              type:
              - string
              - 'null'
              pattern: ^[0-9a-f]{64}$(?![\s\S])
          description: Ausschließlich opake, zugelassene lokale Referenz; keine URL, kein Dateipfad, Rohinhalt,
            Zugangsschlüssel, Zertifikat oder personenbezogener Identifikator.
        receipt:
          $ref: '#/components/schemas/ReadinessSafeReference'
        times:
          $ref: '#/components/schemas/ReadinessTimeliness'
      description: Unveränderter Headinhalt erzeugt einen Abrufreceipt ohne neue Revision; A→B→A erzeugt drei unveränderliche
        Vorkommen. Frühere Beobachtungszeiten und Snapshots bleiben unverändert.
    ReadinessLatencyMetric:
      type: object
      additionalProperties: false
      required:
      - status
      - p50Seconds
      - p95Seconds
      - maximumSeconds
      - sampleCount
      - unknownPairCount
      - invalidPairCount
      properties:
        status:
          type: string
          enum:
          - MEASURED
          - UNKNOWN
          - N/A
        p50Seconds:
          type:
          - string
          - 'null'
          pattern: ^(0|[1-9][0-9]{0,19})(\.[0-9]{1,18})?$(?![\s\S])
        p95Seconds:
          type:
          - string
          - 'null'
          pattern: ^(0|[1-9][0-9]{0,19})(\.[0-9]{1,18})?$(?![\s\S])
        maximumSeconds:
          type:
          - string
          - 'null'
          pattern: ^(0|[1-9][0-9]{0,19})(\.[0-9]{1,18})?$(?![\s\S])
        sampleCount:
          type: integer
          minimum: 0
          maximum: 100000
        unknownPairCount:
          type: integer
          minimum: 0
          maximum: 100000
        invalidPairCount:
          type: integer
          minimum: 0
          maximum: 100000
      description: Exakte Decimal-Sekunden; deterministische Nearest-Rank-Quantile p50/p95 und Maximum ausschließlich
        über gültige, vergleichbare, nichtnegative Zeitpaare. Leere Stichproben liefern null statt einer behaupteten
        Nulllatenz.
      allOf:
      - not:
          not:
            if:
              properties:
                sampleCount:
                  const: 0
              required:
              - sampleCount
              additionalProperties: true
            then:
              properties:
                status:
                  type: string
                  enum:
                  - UNKNOWN
                  - N/A
                p50Seconds:
                  type: 'null'
                p95Seconds:
                  type: 'null'
                maximumSeconds:
                  type: 'null'
              additionalProperties: true
            additionalProperties: true
      - not:
          not:
            if:
              properties:
                status:
                  const: MEASURED
              required:
              - status
              additionalProperties: true
            then:
              properties:
                sampleCount:
                  type: integer
                  minimum: 1
                  maximum: 100000
                p50Seconds:
                  $ref: '#/components/schemas/ReadinessNonnegativeDecimal'
                p95Seconds:
                  $ref: '#/components/schemas/ReadinessNonnegativeDecimal'
                maximumSeconds:
                  $ref: '#/components/schemas/ReadinessNonnegativeDecimal'
              additionalProperties: true
            additionalProperties: true
