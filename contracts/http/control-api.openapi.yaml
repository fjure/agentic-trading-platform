        ask:
          $ref: '#/components/schemas/PaperReadPositiveDecimal'
        observedAt:
          $ref: '#/components/schemas/PaperReadTimestamp'
        providerTime:
          $ref: '#/components/schemas/PaperReadTimestamp'
        validUntil:
          $ref: '#/components/schemas/PaperReadTimestamp'
        sourceCapabilityVersion:
          $ref: '#/components/schemas/PaperReadVersion'
      description: Actual stored quote; timestamps are not renewed by GET. validUntil is the earlier of its stored proof
        validity and observedAt plus 30 seconds. Expired evidence remains visibly expired.
    PaperCapabilityEvidence:
      type: object
      additionalProperties: false
      required:
      - version
      - observedAt
      - validUntil
      - limitOrderConfirmed
      - fractionalConfirmed
      - quantityStep
      - priceTick
