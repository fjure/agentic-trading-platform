      description: MDR-01/MDR-07; REQ-RCX-004, REQ-HMD-006. LocalSession, Same-Origin/CSRF and Idempotency-Key required.
        Accepts either the legacy-shaped explicit Research create request or an operator resume request, never trading
        permission. Repeating a create or resume idempotency key and canonical payload returns the original job with
