          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,254}$
        quote:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - quoteId
          - sourceId
          - bid
          - ask
          - observedAt
          - providerTime
          - validUntil
          - sourceCapabilityVersion
          properties:
            quoteId:
              $ref: '#/components/schemas/PaperReadId'
            sourceId:
              type: string
              const: alpaca-market-data:iex
            bid:
              $ref: '#/components/schemas/PaperReadPositiveDecimal'
            ask:
              $ref: '#/components/schemas/PaperReadPositiveDecimal'
            observedAt:
              $ref: '#/components/schemas/PaperReadTimestamp'
            providerTime:
              $ref: '#/components/schemas/PaperReadTimestamp'
            validUntil:
              $ref: '#/components/schemas/PaperReadTimestamp'
            sourceCapabilityVersion:
              $ref: '#/components/schemas/PaperReadVersion'
          description: Actual stored quote; timestamps are not renewed by GET. validUntil is the earlier of its stored
            proof validity and observedAt plus 30 seconds. Expired evidence remains visibly expired.
        capability:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - version
          - observedAt
          - validUntil
          - limitOrderConfirmed
          - fractionalConfirmed
          - quantityStep
          - priceTick
          properties:
            version:
              $ref: '#/components/schemas/PaperReadVersion'
            observedAt:
              $ref: '#/components/schemas/PaperReadTimestamp'
            validUntil:
              $ref: '#/components/schemas/PaperReadTimestamp'
            limitOrderConfirmed:
              type: boolean
            fractionalConfirmed:
              type: boolean
            quantityStep:
              $ref: '#/components/schemas/PaperReadPositiveDecimal'
            priceTick:
              $ref: '#/components/schemas/PaperReadPositiveDecimal'
        session:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - version
          - open
          - observedAt
          - validUntil
          - startsAt
          - endsAt
          properties:
            version:
              $ref: '#/components/schemas/PaperReadVersion'
            open:
              type: boolean
            observedAt:
              $ref: '#/components/schemas/PaperReadTimestamp'
            validUntil:
              $ref: '#/components/schemas/PaperReadTimestamp'
            startsAt:
              $ref: '#/components/schemas/PaperReadTimestamp'
            endsAt:
              $ref: '#/components/schemas/PaperReadTimestamp'
    PaperSnapshot:
      type: object
      additionalProperties: false
      required:
      - namespace
      - observedAt
      - verificationOperationId
      - status
      - profile
      - portfolio
      - positions
      - markets
      properties:
        namespace:
          type: string
          const: alpaca-paper
        observedAt:
          $ref: '#/components/schemas/PaperReadTimestamp'
        verificationOperationId:
          type:
          - string
          - 'null'
          format: uuid
          maxLength: 36
        status:
          $ref: '#/components/schemas/PaperStatus'
        profile:
          $ref: '#/components/schemas/PaperTradingProfile'
        portfolio:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - currency
          - equity
          - cash
          - exposure
          - ledgerVersion
          - asOf
          - quality
          - reconciliation
          properties:
            currency:
              type: string
              const: USD
            equity:
              $ref: '#/components/schemas/PaperReadNonnegativeDecimal'
            cash:
              $ref: '#/components/schemas/PaperReadNonnegativeDecimal'
            exposure:
              $ref: '#/components/schemas/PaperReadNonnegativeDecimal'
            ledgerVersion:
              $ref: '#/components/schemas/PaperReadVersion'
            asOf:
              $ref: '#/components/schemas/PaperReadTimestamp'
            quality:
              type: string
              enum:
              - VALID
              - STALE
              - GAP
              - CONFLICT
              - INVALID
            reconciliation:
              type: string
              enum:
              - CURRENT
              - PENDING
              - MISMATCH
        positions:
          type:
          - array
          - 'null'
          maxItems: 2
          items:
            $ref: '#/components/schemas/PaperPosition'
        markets:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/PaperMarketEvidence'
      description: Stored Paper projections only; GET performs no provider I/O. observedAt is query time, portfolio.asOf
        is financial-source time and status.reconciledAt is actual reconciliation time. No financial basis is represented
        by null portfolio and positions; an actual flat book has an empty positions array. Missing market proofs are
        null; stale proof timestamps remain unchanged.
      not:
        anyOf:
        - properties:
            portfolio:
              const: null
            positions:
              type: array
        - properties:
            portfolio:
              type: object
            positions:
              const: null
    PaperCancelOverlay:
      type: object
      additionalProperties: false
      required:
      - state
      - requestedAt
      - nextAttemptAt
      - deleteAttempts
      properties:
        state:
          type: string
          enum:
          - READY
          - BACKOFF
          - LOOKUP_ONLY
          - FINISHED
        requestedAt:
          $ref: '#/components/schemas/PaperReadTimestamp'
        nextAttemptAt:
          type:
          - string
          - 'null'
          format: date-time
          pattern: Z$
          maxLength: 30
        deleteAttempts:
          type: integer
          minimum: 0
          maximum: 3
      description: Independent durable cancellation obligation. FINISHED means the obligation is resolved; the actual
        order may be FILLED rather than CANCELED. Never replace the broker order status with this overlay.
    PaperOrder:
      type: object
      additionalProperties: false
      required:
      - orderId
      - clientOrderId
      - proposalId
      - proposalSource
      - decisionId
      - humanRequestId
      - traceId
      - symbol
      - side
      - orderType
      - timeInForce
      - session
      - quantity
      - limitPrice
      - status
      - filledQuantity
      - averageFillPrice
      - updatedAt
      - cancel
      properties:
        orderId:
          type: string
          format: uuid
          maxLength: 36
        clientOrderId:
          $ref: '#/components/schemas/PaperReadId'
        proposalId:
          $ref: '#/components/schemas/PaperReadId'
        proposalSource:
          type: string
          enum:
          - MODEL_DECISION
          - HUMAN_REQUEST
        decisionId:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,254}$
        humanRequestId:
          type:
          - string
          - 'null'
          format: uuid
          maxLength: 36
        traceId:
          $ref: '#/components/schemas/TraceId'
        symbol:
          $ref: '#/components/schemas/PaperSymbol'
        side:
          type: string
          enum:
          - BUY
          - SELL
        orderType:
          type: string
          enum:
          - MARKET
          - LIMIT
        timeInForce:
          type:
          - string
          - 'null'
          enum:
          - DAY
          - null
        session:
          type:
          - string
          - 'null'
          enum:
          - REGULAR
          - null
        quantity:
          $ref: '#/components/schemas/PaperReadPositiveDecimal'
        limitPrice:
          type:
          - string
          - 'null'
          maxLength: 39
          pattern: ^(?=.*[1-9])(0|[1-9][0-9]{0,19})(\.[0-9]{1,18})?$
        status:
          type: string
          enum:
          - CREATED
          - RISK_RESERVED
          - SUBMITTING
          - ACKNOWLEDGED
          - PARTIALLY_FILLED
          - FILLED
          - REJECTED
          - CANCEL_PENDING
          - CANCELED
          - UNKNOWN
        filledQuantity:
          $ref: '#/components/schemas/PaperReadNonnegativeDecimal'
        averageFillPrice:
          type:
          - string
          - 'null'
          maxLength: 39
          pattern: ^(?=.*[1-9])(0|[1-9][0-9]{0,19})(\.[0-9]{1,18})?$
        updatedAt:
          $ref: '#/components/schemas/PaperReadTimestamp'
        cancel:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - state
          - requestedAt
          - nextAttemptAt
          - deleteAttempts
          properties:
            state:
              type: string
              enum:
              - READY
              - BACKOFF
              - LOOKUP_ONLY
              - FINISHED
            requestedAt:
              $ref: '#/components/schemas/PaperReadTimestamp'
            nextAttemptAt:
              type:
              - string
              - 'null'
              format: date-time
              pattern: Z$
              maxLength: 30
            deleteAttempts:
              type: integer
              minimum: 0
              maximum: 3
          description: Independent durable cancellation obligation. FINISHED means the obligation is resolved; the actual
            order may be FILLED rather than CANCELED. Never replace the broker order status with this overlay.
      description: Own stored order with exclusive genuine proposal provenance. Historical MARKET orders retain their
        actual type; DAY and REGULAR are emitted only with stored policy proof, otherwise null. No provider order/account
        identifier is exposed.
      not:
        anyOf:
        - properties:
            proposalSource:
              const: HUMAN_REQUEST
            decisionId:
              type: string
        - properties:
            proposalSource:
              const: HUMAN_REQUEST
            humanRequestId:
              const: null
        - properties:
            proposalSource:
              const: MODEL_DECISION
            humanRequestId:
              type: string
        - properties:
            proposalSource:
              const: MODEL_DECISION
            decisionId:
              const: null
        - properties:
            orderType:
              const: LIMIT
            limitPrice:
              const: null
        - properties:
            orderType:
              const: MARKET
            limitPrice:
              type: string
    PaperFill:
      type: object
      additionalProperties: false
      required:
      - fillId
      - orderId
      - symbol
      - side
      - quantity
      - price
      - occurredAt
      - fee
      - currency
      - traceId
      properties:
        fillId:
