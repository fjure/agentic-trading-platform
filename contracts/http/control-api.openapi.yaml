      description: Signalfrist +60s und Outcomefrist +300s einschließlich Gleichheit. Nenner sind alle nach damals
        sichtbarem regulärem Kalender erwarteten eindeutigen abgeschlossenen 15Min-Baridentitäten, einschließlich
        fehlender und später nachgeladener Bars; unbekannte Tage werden separat gezählt. Fehlend bedeutet keine
        verwendbare Revision am Snapshot, verspätet bedeutet erstmalige Verwendbarkeit nach der jeweiligen Frist;
        diese Fälle sind disjunkt. Korrekturen und Duplikate können Fristkategorien überlappen und vergrößern niemals
        den Sollbarnenner. Empfangszähler beweisen keine Verwendbarkeit. Nutzungsrechte und garantierte Providerlatenz
        bleiben getrennt.
