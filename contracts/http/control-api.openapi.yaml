          type: string
          enum:
          - DISABLED
          - REPLAY
          - SHADOW
          - PAPER
        pauseNew:
          type: boolean
        killSwitch:
          type: boolean
        health:
          type: string
          enum:
          - HEALTHY
          - DEGRADED
          - UNAVAILABLE
        reconciliation:
