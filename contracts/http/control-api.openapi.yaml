                        $ref: '#/components/schemas/Fraction'
                      RANGE:
                        $ref: '#/components/schemas/Fraction'
                      UNCERTAIN:
                        $ref: '#/components/schemas/Fraction'
              evidenceQuality:
                type: object
                additionalProperties: false
                required:
                - kind
                - questionVersion
                - score
                - legend
                - distribution
                - confidence
                properties:
                  kind:
                    type: string
                    const: SCORE
                  questionVersion:
                    type: string
                  score:
                    type: string
                    pattern: ^([0-8](\.[0-9]{1,18})?|9(\.0{1,18})?)$
                  legend:
                    type: object
                    minProperties: 2
                    patternProperties:
                      ^[0-9]$:
                        type: string
                        minLength: 1
                    additionalProperties: false
                  distribution:
                    type: object
                    minProperties: 2
                    patternProperties:
                      ^[0-9]$:
                        $ref: '#/components/schemas/Fraction'
                    additionalProperties: false
                  confidence:
                    $ref: '#/components/schemas/Fraction'
              signalConflict:
                type: object
                additionalProperties: false
                required:
                - kind
                - questionVersion
                - noul
                properties:
                  kind:
                    type: string
                    const: NOUL
                  questionVersion:
                    type: string
                  noul:
                    $ref: '#/components/schemas/Fraction'
              shadowDirection:
                type: object
                additionalProperties: false
                required:
                - kind
                - questionVersion
                - choice
                - confidence
                - distribution
                properties:
                  kind:
                    type: string
                    const: CHOICE
                  questionVersion:
                    type: string
                  choice:
                    type: string
                    enum:
                    - LONG
                    - FLAT
                    - ABSTAIN
                  confidence:
                    $ref: '#/components/schemas/Fraction'
                  distribution:
                    type: object
                    additionalProperties: false
                    required:
                    - LONG
