      pattern: ^(?=.*[1-9])(0|[1-9][0-9]{0,19})(\.[0-9]{1,18})?$
    PaperReadCursor:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: ^[A-Za-z0-9_-]+$
