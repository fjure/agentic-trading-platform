name: agentic-trading-lab-dev
services:
  postgres:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    profiles: [fake]
    user: postgres
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp, /var/run/postgresql]
    environment:
      POSTGRES_USER: lab_migration
      POSTGRES_DB: lab
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres_data:/var/lib/postgresql
    ports: ["127.0.0.1:55432:5432"]
    networks: [local]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U lab_migration -d lab"]
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
  build-smoke:
    profiles: [fake]
    build:
      context: ../..
      dockerfile: infra/containers/Dockerfile
    environment:
      TRADING_MODE: DISABLED
      BROKER_PROVIDER: fake
    networks: [local]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
networks:
  local:
    internal: true
volumes:
  postgres_data:
secrets:
  postgres_password:
    file: ../../.tooling/application/secrets/postgres-password
