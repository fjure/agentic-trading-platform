name: agentic-trading-lab-dev
x-runtime: &runtime
  profiles: [lab, paper]
  build:
    context: ../..
    dockerfile: infra/containers/Dockerfile
    args:
      SOURCE_REVISION: ${ATL_SOURCE_REVISION:-}
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp, "/run/control:uid=10001,gid=10001,mode=0700"]
  init: true
  restart: "no"
  healthcheck:
    test: [CMD, python, -m, services.runtime, health]
    interval: 5s
    timeout: 3s
    start_period: 20s
    retries: 6
  depends_on:
    postgres:
      condition: service_healthy
  configs:
    - source: runtime_config
      target: /run/config/runtime.json
x-paper-runtime: &paper-runtime
  <<: *runtime
  configs:
    - source: paper_runtime_config
      target: /run/config/runtime.json
services:
  postgres:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    profiles: [fake, lab, paper]
    user: postgres
    command: [postgres, -c, hba_file=/etc/postgresql/pg_hba.conf]
    configs:
      - source: postgres_hba
        target: /etc/postgresql/pg_hba.conf
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp, /var/run/postgresql]
    environment:
      POSTGRES_USER: lab_migration
      POSTGRES_DB: lab
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres_data:/var/lib/postgresql
    ports: ["127.0.0.1:55432:5432"]
    networks: [local, execution_db, worker_db, control_db, watchdog_db, demo_db, paper_execution_db, paper_worker_db, paper_control_db, paper_watchdog_db, backtest_db]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U lab_migration -d lab"]
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
  backtest-worker:
    <<: *runtime
    profiles: [backtest]
    command: [python, -m, services.runtime.backtesting, --enable]
    configs: []
    tmpfs: [/tmp]
    networks: [backtest_db]
    cpus: 0.5
    mem_limit: 256m
    healthcheck:
      disable: true
    secrets:
      - source: backtest_database
        target: database
  backtest-provision:
    <<: *runtime
    profiles: [backtest-provision]
    user: "0:0"
    command: [python, -m, services.runtime.backtesting, provision]
    configs: []
    tmpfs: [/tmp]
    networks: [backtest_db]
    healthcheck:
      disable: true
    volumes:
      - ../../.tooling/application/runtime:/run/provision
    secrets: [postgres_password]
  build-smoke:
    profiles: [fake]
    build:
      context: ../..
      dockerfile: infra/containers/Dockerfile
    environment:
      TRADING_MODE: DISABLED
      BROKER_PROVIDER: fake
    networks: [local]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
  execution:
    <<: *runtime
    command: [python, -m, services.runtime, execution]
    networks: [execution_db]
    volumes:
      - alpaca_setup:/run/provider/alpaca:ro
    secrets:
      - source: execution_database
        target: database
  worker:
    <<: *runtime
    command: [python, -m, services.runtime, worker]
    networks: [worker_db]
    volumes:
      - jev_setup:/run/provider/jev:ro
    secrets:
      - source: worker_database
        target: database
  control-api:
    <<: *runtime
    command: [python, -m, services.runtime, api]
    networks: [control_db, demo_control, setup_control, paper_control]
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ../../apps/dashboard/dist/dashboard/browser:/opt/lab/dashboard:ro
    secrets:
      - source: control_database
        target: database
  watchdog:
    <<: *runtime
    command: [python, -m, services.runtime, watchdog]
    networks: [watchdog_db]
    secrets:
      - source: watchdog_database
        target: database
  demo:
    <<: *runtime
    command: [python, -m, services.demo]
    networks: [demo_control, demo_db]
    configs: []
    secrets:
      - source: demo_database
        target: demo_database
    healthcheck:
      test: [CMD, python, -c, "import httpx; r=httpx.Client(trust_env=False).get('http://127.0.0.1:8010/health'); r.raise_for_status()"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 6
  provider-setup:
    <<: *runtime
    command: [python, -m, services.setup]
    networks: [setup_control]
    configs: []
    secrets: []
    depends_on: {}
    volumes:
      - alpaca_setup:/run/provider/alpaca
      - jev_setup:/run/provider/jev
    healthcheck:
      test: [CMD, python, -c, "import httpx; r=httpx.Client(trust_env=False).get('http://127.0.0.1:8011/integrations'); r.raise_for_status()"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 6
  # APW-02: fixed isolated deployment. Dormant commands perform no provider I/O.
  paper-execution:
    <<: *paper-runtime
    command: [python, -m, services.runtime, paper-execution]
    networks: [paper_execution_db, paper_market, paper_execution_egress]
    environment:
      HTTPS_PROXY: http://paper-execution-egress:8080
      HTTP_PROXY: http://paper-execution-egress:8080
      NO_PROXY: postgres,127.0.0.1,localhost
    volumes:
      - alpaca_setup:/run/provider/alpaca:ro
    secrets:
      - source: paper_execution_database
        target: database
    depends_on:
      postgres:
        condition: service_healthy
      paper-execution-egress:
        condition: service_healthy
  paper-worker:
    <<: *paper-runtime
    command: [python, -m, services.runtime, paper-worker]
    networks: [paper_worker_db, paper_market, paper_worker_egress]
    environment:
      HTTPS_PROXY: http://paper-worker-egress:8080
      HTTP_PROXY: http://paper-worker-egress:8080
      NO_PROXY: postgres,127.0.0.1,localhost
    volumes:
      - jev_setup:/run/provider/jev:ro
    secrets:
      - source: paper_worker_database
        target: database
    depends_on:
      postgres:
        condition: service_healthy
      paper-worker-egress:
        condition: service_healthy
  paper-api:
    <<: *paper-runtime
    command: [python, -m, services.runtime, paper-api]
    networks: [paper_control_db, paper_control]
    secrets:
      - source: paper_control_database
        target: database
  paper-watchdog:
    <<: *paper-runtime
    command: [python, -m, services.runtime, paper-watchdog]
    networks: [paper_watchdog_db]
    secrets:
      - source: paper_watchdog_database
        target: database
  paper-execution-egress:
    <<: *runtime
    command: [python, -m, services.runtime.egress, execution]
    configs: []
    depends_on: {}
    tmpfs: [/tmp]
    networks: [paper_execution_egress, paper_execution_outbound]
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1',8080),timeout=1).close()"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 6
  paper-worker-egress:
    <<: *runtime
    command: [python, -m, services.runtime.egress, worker]
    configs: []
    depends_on: {}
    tmpfs: [/tmp]
    networks: [paper_worker_egress, paper_worker_outbound]
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1',8080),timeout=1).close()"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 6
networks:
  backtest_db:
    internal: true
  local:
    internal: true
  execution_db:
    internal: true
  worker_db:
    internal: true
  control_db:
    internal: true
  watchdog_db:
    internal: true
  demo_db:
    internal: true
  demo_control:
    internal: true
  setup_control:
    internal: true
  paper_execution_db:
    internal: true
  paper_worker_db:
    internal: true
  paper_control_db:
    internal: true
  paper_watchdog_db:
    internal: true
  paper_control:
    internal: true
  paper_market:
    internal: true
  paper_execution_egress:
    internal: true
  paper_worker_egress:
    internal: true
  paper_execution_outbound: {}
  paper_worker_outbound: {}
volumes:
  postgres_data:
  alpaca_setup:
  jev_setup:
secrets:
  backtest_database:
    file: ../../.tooling/application/runtime/backtest.json
  postgres_password:
    file: ../../.tooling/application/secrets/postgres-password
  execution_database:
    file: ../../.tooling/application/runtime/execution.json
  worker_database:
    file: ../../.tooling/application/runtime/worker.json
  control_database:
    file: ../../.tooling/application/runtime/control.json
  watchdog_database:
    file: ../../.tooling/application/runtime/watchdog.json
  demo_database:
    file: ../../.tooling/application/runtime/demo.json
  paper_execution_database:
    file: ../../.tooling/application/runtime/paper-execution.json
  paper_worker_database:
    file: ../../.tooling/application/runtime/paper-worker.json
  paper_control_database:
    file: ../../.tooling/application/runtime/paper-control.json
  paper_watchdog_database:
    file: ../../.tooling/application/runtime/paper-watchdog.json
configs:
  postgres_hba:
    file: ./pg_hba.conf
  paper_runtime_config:
    file: ../../.tooling/application/runtime/paper-runtime.json
  runtime_config:
    file: ../../.tooling/application/runtime/runtime.json
