# APW-02: first-match rules restrict only the four fixed Paper login identities.
host lab_paper_runtime atl_backtest_worker_login all scram-sha-256
host all atl_backtest_worker_login all reject
local all atl_backtest_worker_login reject
host replication atl_backtest_worker_login all reject
# Paper uses its own database; no role, database or client address is configurable.
local lab_paper_runtime atl_paper_execution_login,atl_paper_worker_login,atl_paper_control_api_login,atl_paper_watchdog_login scram-sha-256
host lab_paper_runtime atl_paper_execution_login,atl_paper_worker_login,atl_paper_control_api_login,atl_paper_watchdog_login all scram-sha-256
local all atl_paper_execution_login,atl_paper_worker_login,atl_paper_control_api_login,atl_paper_watchdog_login reject
host all atl_paper_execution_login,atl_paper_worker_login,atl_paper_control_api_login,atl_paper_watchdog_login all reject
local replication atl_paper_execution_login,atl_paper_worker_login,atl_paper_control_api_login,atl_paper_watchdog_login reject
host replication atl_paper_execution_login,atl_paper_worker_login,atl_paper_control_api_login,atl_paper_watchdog_login all reject

# Preserve the official image's initdb local/loopback and appended host defaults.
local all all trust
host all all 127.0.0.1/32 trust
host all all ::1/128 trust
local replication all trust
host replication all 127.0.0.1/32 trust
host replication all ::1/128 trust
host all all all scram-sha-256
