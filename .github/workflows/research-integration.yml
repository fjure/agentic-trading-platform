name: Research integration
on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]
  push:
    branches: [main, 'codex/ptv-*-arp-*']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Research ${{ matrix.gate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        gate: [fast, db, browser]
    env:
      GATE: ${{ matrix.gate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.16'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: matrix.gate == 'browser'
        with:
          node-version: '22.23.3'
      - name: Install locked dependencies
        id: dependencies
        run: |
          python -m pip install uv==0.13.0
          uv sync --frozen --python python --no-python-downloads
      - name: Lint Research runtime and CI code
        if: matrix.gate == 'fast'
        run: |
          .venv/bin/ruff check packages/agent_research services/llm_gateway scripts/check-research-evidence.py scripts/test-research-db.py scripts/test-research-browser.py
      - name: Execute required cases and record evidence
        if: always() && !cancelled()
        env:
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
        run: |
          sha=$(git rev-parse HEAD)
          test "$sha" = "$GITHUB_SHA"
          junit="$RUNNER_TEMP/research-results.xml"
          status=missing_environment
          reason="Locked dependencies unavailable"
          if [[ "$DEPENDENCIES" == success ]]; then
            result=0
            case "$GATE" in
              fast) .venv/bin/python -m pytest \
                tests/contracts/test_agent_research_contract.py \
                tests/unit/test_provider_discovery_dispatch.py \
                tests/unit/test_llm_provider_http.py \
                tests/unit/test_llm_tls_socket.py \
                tests/unit/test_agent_research_budget.py \
                tests/unit/test_research_evidence_gate.py \
                tests/security/test_provider_credential_authority.py \
                --junitxml "$junit" -o junit_logging=no -o junit_log_passing_tests=false || result=$? ;;
              db) .venv/bin/python scripts/test-research-db.py --junitxml "$junit" || result=$? ;;
              browser) .venv/bin/python scripts/test-research-browser.py --junitxml "$junit" || result=$? ;;
            esac
            if [[ "$result" == 0 ]]; then
              status=passed
              reason="Required runner completed"
            elif [[ "$result" == 2 && "$GATE" != fast ]]; then
              reason="Required environment unavailable"
            else
              status=failed
              reason="Required runner failed (exit $result)"
            fi
          fi
          args=()
          if [[ -f "$junit" ]]; then args+=(--junit "$junit"); fi
          python scripts/check-research-evidence.py record --gate "$GATE" \
            --source-sha "$sha" --output "$RUNNER_TEMP/evidence" \
            --status "$status" --reason "$reason" "${args[@]}"
          test "$status" = passed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && !cancelled()
        with:
          name: research-${{ matrix.gate }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 7

  required:
    name: Research required evidence
    if: always()
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ${{ runner.temp }}/research-artifacts
          pattern: research-*
      - name: Verify evidence at the checked out revision
        if: always()
        env:
          GATE_RESULT: ${{ needs.gate.result }}
        run: |
          sha=$(git rev-parse HEAD)
          test "$sha" = "$GITHUB_SHA"
          for gate in fast db browser; do
            mv "$RUNNER_TEMP/research-artifacts/research-$gate" "$RUNNER_TEMP/research-artifacts/$gate" || true
          done
          python3 scripts/check-research-evidence.py check --source-sha "$sha" \
            --artifacts "$RUNNER_TEMP/research-artifacts" --browser-required true
          test "$GATE_RESULT" = success
